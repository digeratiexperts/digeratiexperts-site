emails:
  - id: A
    to: Clients
    send: 2026-10-22
    subject: "Your renewal questionnaire has questions. We have an hour."
    preview: "{date_short}, {time} {tz}. Bring the form; we'll bring the answers you can back up."
    body: |
      Cyber insurance applications don't ask what you bought any more. They ask how you operate: MFA, endpoint protection, email authentication, backups, awareness training. If your renewal is coming up, the time to find a gap is before the questionnaire, not halfway through underwriting.

      On **{date_long} at {time} {tz}**, {presenter} is running a one-hour working session on exactly that:

      - the control areas carrier questionnaires typically ask about, in plain language
      - how to tell a missing control from missing evidence of one you already run
      - what to do first when renewal is weeks away, not months

      Bring the questionnaire if you have one. Highlighters optional.

      The boring-but-important part: carriers decide coverage and counsel interprets the policy. We can't promise either. We can help you implement and document the technical side.
    cta: Save your seat

  - id: B
    to: Prospects
    send: 2026-10-22
    resend: 2026-10-29
    subject: "Your cyber insurance form is an exam. Study session: {date_short}"
    preview: "A free working hour on what underwriters ask, and how to answer honestly."
    body: |
      Your cyber insurance renewal form now reads like an IT audit, because it is one. MFA, endpoint protection, email authentication, tested backups, staff training. Each one is a yes-or-no box, and "we think so" is not an answer the box accepts.

      On **{date_long} at {time} {tz}** we're running a free one-hour session for owners, finance and the IT people who have to fill the thing in. Bring your form if you have one. We'll go through it question by question and sort each answer into the two piles that matter: controls you have, and controls you have but can't prove.

      - what each control area is, and why carriers keep asking about it
      - missing control or missing evidence: how to tell which one you've got
      - a sensible order for the fixes when renewal is close, not when it's on fire

      Two honest notes before you register. We don't sell insurance, and we can't promise coverage. Carriers decide that, and counsel reads the policy. We can only help with the technical answers.
    cta: Save your seat

  - id: C
    to: Registrants
    send: 2026-10-29
    subject: "One week. Your questionnaire is invited too."
    preview: "{date_short}, {time} to {end_time} {tz}. Join link arrives the day before."
    body: |
      You're registered for *{title}* next **{date_long}, {time} to {end_time} {tz}**.

      If you have your carrier's questionnaire, have it to hand. The last 15 minutes are for your questions, including the awkward ones.

      The join link arrives the day before. Add the session to your calendar from the page, so Future You can't say nobody mentioned it.
    cta: Add it to your calendar

  - id: D
    to: Registrants
    send: 2026-11-04
    subject: "Tomorrow, {time} {tz}: your join link"
    preview: "{date_short}. Coffee recommended, cameras optional."
    body: |
      See you tomorrow, **{date_long} at {time} {tz}** ({other_zones}).

      **Join:** [JOIN LINK]

      Agenda ({minutes} min): {agenda}.

      Coffee recommended. Cameras optional. Questionnaire encouraged.

  - id: E
    to: Registrants and attendees
    send: 2026-11-09
    subject: "The recording, and a next step if you want one"
    preview: "Slides, recording, and an offer to read your questionnaire with you."
    body: |
      Thank you for [joining us / registering] for *{title}*.

      - **Recording and slides:** [LINK]
      - **Your next step, if you want one:** we go through your questionnaire against your actual environment and sort what's missing from what just needs writing down.

      As we said on the call: carriers decide coverage, so treat anything we said as the technical side only. We're IT people. We know our lane.
    cta: See the renewal readiness review
    cta_url: "{campaign}"

linkedin:
  - send: 2026-10-22
    text: |
      Cyber insurance applications read more like IT audits every year. MFA, endpoint protection, email authentication, tested backups, awareness training: they're questions now, not extras. And "mostly" isn't one of the checkboxes.

      On {date_short} ({time} {tz}) {presenter} is running a free working hour on what those questions mean, and how to tell a missing control from missing evidence of one you already run.

      We don't sell insurance and can't promise coverage. This is the technical side, in plain language, with fewer acronyms than the form.
      {page}
  - send: 2026-10-29
    text: |
      "Do you enforce MFA for all remote access?" is a yes/no box on a lot of renewal forms. The honest answer is often "mostly", and "mostly" is not a box.

      One week until our working hour on the controls underwriters ask about: {date_short}, {time} {tz}. Free, and the questionnaire is welcome.
      {page}

