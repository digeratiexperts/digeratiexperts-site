<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Store Concept 2 · Marketplace</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  --ink:#111018; --ink-2:#3d3c46; --ink-3:#6c6b76; --line:#e3e3e8; --line-2:#d2d2d9;
  --page:#eceef2; --card:#fff; --bar:#0b0a12; --bar-2:#1a1824;
  --magenta:#d3126a; --magenta-d:#b00e58; --blue:#1d6ff2; --blue-ink:#0b4fc4; --blue-wash:#eaf1fe;
  --urgent:#b4235a; --ok:#137a49;
  --sh-1:0 1px 2px rgba(17,16,24,.07); --sh-2:0 1px 3px rgba(17,16,24,.06),0 10px 28px -14px rgba(17,16,24,.25);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box} body{margin:0;background:var(--page);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif}
a{color:inherit} button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
h1,h2,h3,h4{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.015em;margin:0}
.wrap{max-width:1360px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid transparent;font-weight:600;font-size:14px;text-decoration:none;transition:background-color .15s var(--ease),border-color .15s var(--ease),transform .15s var(--ease)}
.btn:active{transform:translateY(1px)}
.btn--add{background:var(--blue);color:#fff}.btn--add:hover{background:#155ed4}
.btn--ghost{background:#fff;border-color:var(--line-2);color:var(--ink)}.btn--ghost:hover{border-color:var(--ink)}
.btn--primary{background:var(--magenta);color:#fff;min-height:44px;border-radius:999px}.btn--primary:hover{background:var(--magenta-d)}
.btn--primary[disabled]{background:#e8d6de;color:#8a6a78;cursor:not-allowed}

/* header: logo · big search · phone · Your Solution */
.top{background:var(--bar);color:#fff;position:sticky;top:0;z-index:10}
.top .wrap{display:flex;align-items:center;gap:20px;height:72px}
.top img{height:30px;display:block}
.search{flex:1;display:flex;height:46px;border-radius:12px;overflow:hidden;background:#fff;max-width:720px;box-shadow:0 0 0 2px transparent;transition:box-shadow .15s}
.search:focus-within{box-shadow:0 0 0 3px rgba(29,111,242,.55)}
.search select{border:0;background:#eef0f4;padding:0 12px;font:500 13.5px Inter;color:var(--ink-2);border-right:1px solid var(--line)}
.search input{flex:1;border:0;outline:0;padding:0 14px;font:inherit;min-width:0}
.search button{width:54px;border:0;background:var(--magenta);color:#fff;display:grid;place-items:center}
.tel{display:flex;flex-direction:column;font-size:12px;color:rgba(255,255,255,.65);text-decoration:none;line-height:1.25}
.tel b{font-size:14.5px;color:#fff}
.cart{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 14px;border-radius:12px;border:1px solid rgba(255,255,255,.16);text-decoration:none;color:#fff}
.cart:hover{border-color:#fff}
.cart .n{font:700 13px Oxanium;min-width:24px;height:24px;border-radius:999px;background:var(--magenta);display:grid;place-items:center}
.cart span{font-size:12px;color:rgba(255,255,255,.65);line-height:1.2}.cart span b{display:block;color:#fff;font-size:14.5px}
.sub{background:var(--bar-2);color:rgba(255,255,255,.85);font-size:14px}
.sub .wrap{display:flex;gap:6px;height:44px;align-items:center;overflow-x:auto;scrollbar-width:none}
.sub a{white-space:nowrap;padding:6px 10px;border-radius:8px;text-decoration:none}
.sub a:hover{background:rgba(255,255,255,.08)}
.sub a[aria-current]{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
.sub .sep{width:1px;height:20px;background:rgba(255,255,255,.15);margin:0 6px;flex:none}

/* hero banner with the profile as the "deliver to" box */
.banner{background:linear-gradient(100deg,#0b0a12 0%,#141029 55%,#1b1340 100%);color:#fff;position:relative;overflow:hidden}
.banner::after{content:"";position:absolute;inset:auto -10% -60% 40%;height:120%;background:radial-gradient(closest-side,rgba(29,111,242,.35),transparent);pointer-events:none}
.banner .wrap{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;padding-top:44px;padding-bottom:110px;position:relative;z-index:1}
.eyebrow{font:600 12px Oxanium;letter-spacing:.18em;text-transform:uppercase;color:#8dbbff}
.banner h1{font-size:clamp(32px,4.2vw,50px);line-height:1.04;margin:12px 0 14px}
.banner p{margin:0;color:rgba(255,255,255,.75);font-size:16.5px;max-width:52ch}
.journey{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px;font-size:13px;color:rgba(255,255,255,.6)}
.journey span{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.06)}
.journey span[aria-current]{background:#fff;color:var(--ink);font-weight:600}
.size{align-self:start;background:#fff;color:var(--ink);border-radius:16px;padding:18px;box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.size h2{font-size:17px;display:flex;align-items:center;gap:8px}
.size p{color:var(--ink-3);font-size:13px;margin:2px 0 12px}
.size .counts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.size label{display:block;border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;font-size:12px;font-weight:600;color:var(--ink-3)}
.size label:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-wash)}
.size input{display:block;width:100%;border:0;outline:0;font:600 20px Oxanium;color:var(--ink);padding:0;background:transparent}
.size .go{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px;color:var(--ink-3)}

/* Amazon-homepage boxes that overlap the banner */
.boxes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:-80px;position:relative;z-index:2}
.box{background:var(--card);border-radius:14px;padding:18px 18px 8px;box-shadow:var(--sh-2);display:flex;flex-direction:column}
.box__h{display:flex;gap:10px;align-items:center;margin-bottom:4px}
.box__h .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--blue-wash);color:var(--blue-ink);flex:none}
.box--now .box__h .ico{background:#fdecf2;color:var(--urgent)}
.box h2{font-size:18px}
.box > p{margin:0 0 6px 44px;font-size:13.5px;color:var(--ink-3)}
.box ul{list-style:none;margin:0;padding:0}
.box li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.box li h3{font:600 14.5px/1.3 "Space Grotesk"}
.box li p{grid-column:1;margin:0;font-size:13px;color:var(--ink-3)}
.box li .btn{grid-row:1/3;grid-column:2;min-height:38px;padding:0 12px;font-size:13.5px}
.box .more{margin-top:auto;padding:10px 0;border-top:1px solid var(--line);font-size:14px;font-weight:600;color:var(--urgent);text-decoration:none}

/* catalog with filters */
.catalog{display:grid;grid-template-columns:240px minmax(0,1fr) 300px;gap:20px;margin:28px auto 64px;align-items:start}
.filters{background:var(--card);border-radius:14px;padding:16px;box-shadow:var(--sh-1);position:sticky;top:132px}
.filters h3{font-size:14px;margin:4px 0 8px}
.filters fieldset{border:0;margin:0 0 14px;padding:0}
.filters legend{font:600 12px Oxanium;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.filters label{display:flex;align-items:center;gap:10px;min-height:36px;font-size:14px;color:var(--ink-2);cursor:pointer}
.filters input{width:18px;height:18px;accent-color:var(--blue)}
.filters .ct{margin-left:auto;font:500 12px Oxanium;color:var(--ink-3)}
.results__h{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.results__h h2{font-size:24px}
.results__h p{margin:2px 0 0;color:var(--ink-3);font-size:14px}
.results__h select{height:40px;border-radius:10px;border:1px solid var(--line-2);padding:0 10px;font:inherit;background:#fff}
.list{display:grid;gap:12px}
.item{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:18px;align-items:center;background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--sh-1);border:1px solid transparent;transition:border-color .15s,box-shadow .2s var(--ease)}
.item:hover{border-color:var(--line-2);box-shadow:var(--sh-2)}
.thumb{height:96px;border-radius:10px;display:grid;place-items:center;background:radial-gradient(120% 120% at 20% 0%,#f4f7ff,#e7ecf7);color:var(--blue-ink)}
.thumb svg{width:38px;height:38px}
.item .goal{font:600 11px Oxanium;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.item h3{font-size:17px;margin:2px 0 4px}
.item p{margin:0;font-size:13.5px;color:var(--ink-2)}
.item .meta{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px;font-size:13px;color:var(--ink-2)}
.item .meta span{display:inline-flex;gap:5px;align-items:center}
.item .meta svg{color:var(--ok);width:15px;height:15px}
.item .acts{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:150px}
/* summary */
.summary{background:var(--card);border-radius:14px;padding:18px;box-shadow:var(--sh-2);position:sticky;top:132px}
.summary h3{font-size:18px}
.summary .line{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:14px;color:var(--ink-2);margin-top:10px}
.summary .line b{font-family:Oxanium}
.summary .btn--primary{width:100%;margin-top:6px}
.summary small{display:block;text-align:center;color:var(--ink-3);font-size:12.5px;margin-top:8px}
.summary .note{margin-top:14px;padding:12px;border-radius:10px;background:#f4f5f8;font-size:13px;color:var(--ink-2);display:flex;gap:8px}
.summary .note svg{flex:none;color:var(--ink-3)}

@media (max-width:1200px){.catalog{grid-template-columns:220px minmax(0,1fr)}.summary{display:none}}
@media (max-width:980px){
  .tel{display:none}.banner .wrap{grid-template-columns:1fr;padding-bottom:100px}
  .boxes{grid-template-columns:1fr 1fr}.box--prove{grid-column:1/-1}
  .catalog{grid-template-columns:1fr}.filters{position:static;display:flex;gap:16px;overflow-x:auto}.filters fieldset{min-width:220px}.filters h3{display:none}
}
@media (max-width:720px){
  .wrap{padding:0 14px}
  .top .wrap{flex-wrap:wrap;height:auto;padding-top:10px;padding-bottom:10px;gap:10px}
  .search{order:3;flex-basis:100%}.search select{display:none}
  .cart{margin-left:auto}.cart span{display:none}
  .size .counts{grid-template-columns:1fr 1fr}
  .boxes{grid-template-columns:1fr}
  .item{grid-template-columns:64px minmax(0,1fr);gap:12px}.thumb{height:64px}.thumb svg{width:28px;height:28px}
  .item .acts{grid-column:1/-1;flex-direction:row}.item .acts .btn{flex:1}
  .filters{flex-direction:column}.filters fieldset{min-width:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script src="icons.js"></script><script src="data.js"></script>
<script>
const S = STORE, F = S.families;
const goalOf = id => S.goals.find(g => g.f.includes(id));
document.getElementById("app").outerHTML = `
<header class="top"><div class="wrap">
  <img src="digerati-logo-reverse.svg" alt="Digerati Experts">
  <form class="search" role="search" onsubmit="return false"><label class="sr" for="q">Search needs</label>
    <select aria-label="Search in"><option>All needs</option>${S.goals.map(g => `<option>${g.l}</option>`).join("")}</select>
    <input id="q" placeholder="Search needs: backups, phones, MFA, new hires…"><button aria-label="Search">${ic("search", 20)}</button></form>
  <a class="tel" href="tel:+13254809870">Talk to DE<b>${S.phone}</b></a>
  <a class="cart" href="#sum"><span class="n">0</span><span>Your<b>Solution</b></span></a>
</div></header>
<nav class="sub" aria-label="Shop by goal"><div class="wrap"><a href="#" aria-current="page">All needs</a>${S.goals.map(g => `<a href="#">${g.l}</a>`).join("")}<span class="sep"></span><a href="#">Handle Our IT</a><a href="#">Client Marketplace</a></div></nav>
<main>
<section class="banner"><div class="wrap">
  <div><div class="eyebrow">${S.hero.eyebrow}</div><h1>${S.hero.h1a}<br>${S.hero.h1b}</h1><p>${S.hero.lede}</p>
    <div class="journey" aria-label="Your journey">${S.steps.map((s, i) => `<span ${i === 1 ? 'aria-current="step"' : ""}>${i + 1} · ${s}</span>`).join("")}</div></div>
  <form class="size" onsubmit="return false" aria-labelledby="sz"><h2 id="sz">${ic("building-2", 18)}Size it to your business</h2><p>Four counts. Every package sizes itself. Needed before you submit.</p>
    <div class="counts">${S.profile.map(p => `<label>${p.k}<input inputmode="numeric" placeholder="0"></label>`).join("")}</div>
    <div class="go"><span>+ ownership and internal IT</span><button class="btn btn--ghost" type="button">Save counts</button></div></form>
</div></section>
<div class="wrap">
  <section class="boxes" aria-label="Start from a situation">${S.groups.map(g => { const items = S.scenarios.filter(s => s.g === g.k); return `
    <article class="box box--${g.k}"><div class="box__h"><span class="ico">${ic(g.i, 18)}</span><h2>${g.h}</h2></div><p>${g.sub}</p>
    <ul>${items.map(s => `<li><h3>${s.t}</h3><p>${s.f.map(id => F[id].l).join(" · ")}</p><button class="btn btn--ghost" type="button">${ic("plus", 15)}Add ${s.f.length}</button></li>`).join("")}</ul>
    ${g.k === "now" ? `<a class="more" href="tel:+13254809870">Happening right now? Call ${S.phone} →</a>` : ""}</article>`; }).join("")}</section>
  <div class="catalog">
    <aside class="filters" aria-label="Filters"><h3>Filter</h3>
      <fieldset><legend>Goal</legend>${S.goals.map(g => `<label><input type="checkbox">${g.l}<span class="ct">${g.f.length}</span></label>`).join("")}</fieldset>
      <fieldset><legend>Relationship</legend>${["Standalone","Co-managed","Help me choose"].map((x,i) => `<label><input type="radio" name="rel" ${i==2?"checked":""}>${x}</label>`).join("")}</fieldset>
    </aside>
    <section aria-labelledby="r-h"><div class="results__h"><div><h2 id="r-h">All solution families</h2><p>13 families · each sizes to your profile</p></div><label><span class="sr">Sort</span><select><option>Grouped by goal</option><option>A to Z</option></select></label></div>
      <div class="list">${S.goals.flatMap(g => g.f).map(id => [id, F[id]]).map(([id, f]) => `<article class="item"><div class="thumb">${ic(f.i, 38)}</div><div><div class="goal">${goalOf(id).l}</div><h3>${f.l}</h3><p>${f.d}</p><div class="meta"><span>${ic("check", 15)}${f.o}</span><span>${ic("check", 15)}Standalone or co-managed</span></div></div><div class="acts"><button class="btn btn--add" type="button">${ic("plus", 16)}Add to solution</button><a class="btn btn--ghost" href="#">View package</a></div></article>`).join("")}</div>
    </section>
    <aside class="summary" id="sum" aria-label="Your Solution"><h3>Your Solution</h3>
      <div class="line"><span>Needs</span><b>0</b></div><div class="line" style="margin-top:0"><span>Sized to</span><a href="#sz" style="color:var(--blue-ink);font-weight:600">Add counts</a></div>
      <button class="btn btn--primary" disabled>Review Your Solution</button><small>Add at least one need</small>
      <div class="note">${ic("lock", 16)}No payment here. DE sends a real quote.</div></aside>
  </div>
</div>
</main>`;
</script>
</body>
</html>
