<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Store Concept 4 · Flagship</title>
<meta name="description" content="Tell Digerati Experts what you have once, pick what needs attention, and hold a sized solution you can send for a real quote.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="fonts.css">
<style>
/*
 * apple.com/iphone grammar, DE identity: a frosted local nav, a black hero
 * with one sculptural object, sections that alternate #f5f5f7 / white /
 * black, headlines that end in a full stop, 28px cards, horizontal galleries
 * with round paddles, a configurator, a lineup, a "why here" carousel.
 */
:root{
  --black:#000; --ink:#1d1d1f; --ink-2:#424245; --ink-3:#6e6e73; --mist:#f5f5f7; --white:#fff; --line:#d2d2d7;
  --blue:#1d6ff2; --blue-ink:#0a56d0; --blue-sky:#6fb3ff; --magenta:#d3126a; --magenta-d:#b80e5c;
  --r-xl:28px; --r-lg:22px; --r-md:16px;
  --ease:cubic-bezier(.28,.11,.32,1); --spring:cubic-bezier(.2,.8,.2,1);
  --wrap:1180px;
}
*{box-sizing:border-box} html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--white);color:var(--ink);font:17px/1.47 Inter,system-ui,sans-serif;letter-spacing:-.012em;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none} button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--magenta);outline-offset:3px;border-radius:6px}
h1,h2,h3,h4{font-family:"Space Grotesk",Inter,sans-serif;margin:0;letter-spacing:-.025em;font-weight:700}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 22px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.link{color:var(--blue-ink);font-weight:500}
.link:hover{text-decoration:underline}
.link::after{content:" ›";font-size:1.1em}
.dark .link{color:var(--blue-sky)}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 22px;border-radius:999px;border:0;font-weight:600;font-size:16px;transition:background-color .2s var(--ease),transform .2s var(--spring)}
.pill:active{transform:scale(.97)}
.pill--magenta{background:var(--magenta);color:#fff}.pill--magenta:hover{background:var(--magenta-d)}
.pill--blue{background:var(--blue);color:#fff}.pill--blue:hover{background:var(--blue-ink)}
.pill--ghost{background:transparent;color:var(--blue-ink);box-shadow:inset 0 0 0 1px var(--blue-ink)}
.pill--ghost:hover{background:rgba(29,111,242,.06)}
.pill--sm{min-height:36px;padding:0 16px;font-size:14px}

/* global + local nav */
.gnav{height:44px;background:rgba(0,0,0,.92);color:rgba(255,255,255,.82);font-size:12.5px}
.gnav .wrap{display:flex;align-items:center;gap:28px;height:44px}
.gnav img{height:20px;opacity:.95}
.gnav span[aria-current]{color:#fff}
.gnav .links{display:contents}
.gnav .sp{flex:1}
.lnav{position:sticky;top:0;z-index:20;background:rgba(251,251,253,.8);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.08)}
.lnav .wrap{display:flex;align-items:center;gap:24px;height:56px}
.lnav b{font:700 21px "Space Grotesk";letter-spacing:-.02em}
.lnav nav{margin-left:auto;display:flex;gap:22px;font-size:13px;color:var(--ink-2)}
.lnav nav a:hover{color:var(--ink)}
.lnav .pill{min-height:30px;padding:0 14px;font-size:13px}
.lnav .count{font:700 12px Oxanium;background:rgba(255,255,255,.22);border-radius:999px;min-width:20px;height:20px;display:inline-grid;place-items:center;padding:0 5px}

/* reveal */
.js .rv{opacity:0;transform:translateY(32px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.js .rv.in{opacity:1;transform:none}
.js .rv[data-d="1"]{transition-delay:.08s}.js .rv[data-d="2"]{transition-delay:.16s}.js .rv[data-d="3"]{transition-delay:.24s}

/* hero */
.hero{background:var(--black);color:#f5f5f7;overflow:hidden;position:relative}
.hero .wrap{display:grid;grid-template-columns:1.25fr 1fr;align-items:center;gap:40px;min-height:min(820px,92vh);padding-top:72px;padding-bottom:72px}
.eyebrow{font:600 14px Oxanium;letter-spacing:.2em;text-transform:uppercase;color:var(--blue-sky)}
.hero h1{font-size:clamp(46px,6.4vw,88px);line-height:.98;letter-spacing:-.04em;margin:18px 0 24px}
.hero h1 em{font-style:normal;display:block;background:linear-gradient(92deg,#fff 0%,#a9cbff 55%,#6fb3ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:clamp(19px,1.7vw,24px);line-height:1.38;color:#a1a1a6;max-width:30ch;margin:0}
.hero p b{color:#f5f5f7;font-weight:600}
.hero .ctas{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;margin-top:36px}
.hero .note{margin-top:22px;font-size:14px;color:#86868b}
/* the sculpture: 13 family glyphs in an isometric field, lit from below */
.sculpt{position:relative;height:560px;perspective:1400px}
.sculpt::before{content:"";position:absolute;inset:10% 5% 0;background:radial-gradient(closest-side,rgba(29,111,242,.55),rgba(29,111,242,.12) 55%,transparent 75%);filter:blur(30px)}
.plane{position:absolute;left:50%;top:50%;width:520px;height:520px;margin:-260px 0 0 -260px;transform:rotateX(58deg) rotateZ(-38deg);transform-style:preserve-3d;display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.plane .g{transform:translateZ(var(--z,0px));animation:float 7s var(--ease) infinite alternate;animation-delay:var(--dl,0s)}
@keyframes float{to{transform:translateZ(calc(var(--z,0px) + 26px))}}
.g{aspect-ratio:1;border-radius:26%;display:grid;place-items:center;position:relative}
.g svg{width:46%;height:46%;stroke-width:1.5}
.g--electric{background:linear-gradient(150deg,#4b8ef8 0%,#1d6ff2 40%,#0a3fa8 100%);color:#fff;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),inset 0 -14px 24px rgba(0,0,0,.28),0 26px 40px -16px rgba(29,111,242,.75)}
.g--graphite{background:linear-gradient(150deg,#3a3a42 0%,#1c1c22 45%,#0b0b0f 100%);color:#8ec0ff;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.18),inset 0 -14px 24px rgba(0,0,0,.4),0 26px 40px -16px rgba(0,0,0,.9)}
.g--paper{background:linear-gradient(150deg,#ffffff 0%,#f2f2f5 50%,#dcdce2 100%);color:var(--blue-ink);box-shadow:inset 0 1.5px 0 #fff,inset 0 -14px 24px rgba(0,0,0,.08),0 26px 40px -16px rgba(0,0,0,.55)}
.g--magenta{background:linear-gradient(150deg,#f0458f 0%,#d3126a 45%,#8f0a47 100%);color:#fff;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.4),inset 0 -14px 24px rgba(0,0,0,.28),0 26px 40px -16px rgba(211,18,106,.7)}
.g--ghost{background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}

/* section heads */
.sec{padding:110px 0}
.sec--mist{background:var(--mist)}
.sec--dark{background:var(--black);color:#f5f5f7}
.head{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:40px}
.head h2{font-size:clamp(36px,4.6vw,56px);line-height:1.05;max-width:20ch;text-wrap:balance}
.head h2 span{color:var(--ink-3)}
.sec--dark .head h2 span{color:#86868b}
.head .aside{font-size:17px;color:var(--ink-2);max-width:34ch;text-align:right}

/* segmented tabs */
.seg{display:inline-flex;padding:4px;border-radius:999px;background:#e8e8ed;gap:2px;margin-bottom:28px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{border:0;background:transparent;min-height:36px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:500;color:var(--ink-2);white-space:nowrap;transition:background-color .25s var(--ease),color .25s var(--ease),box-shadow .25s var(--ease)}
.seg button[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* gallery */
.gallery{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px max(22px,calc((100vw - var(--wrap))/2 + 22px)) 30px 22px;margin:0 calc((100% - 100vw)/2 - 0px) 0 -22px;scrollbar-width:none;scroll-padding:22px}
.gallery::-webkit-scrollbar{display:none}
.gcard{flex:0 0 360px;height:560px;scroll-snap-align:start;border-radius:var(--r-xl);position:relative;overflow:hidden;display:flex;flex-direction:column;padding:30px 30px 26px;transition:transform .45s var(--ease),box-shadow .45s var(--ease)}
.gcard:hover{transform:scale(1.012);box-shadow:0 18px 50px -20px rgba(0,0,0,.35)}
.gcard--black{background:#000;color:#f5f5f7}
.gcard--white{background:#fff;color:var(--ink)}
.gcard--now{background:radial-gradient(120% 70% at 50% 120%,rgba(211,18,106,.55),transparent 60%),#0b0b0f;color:#f5f5f7}
.gcard .cat{font:600 12px Oxanium;letter-spacing:.16em;text-transform:uppercase;color:#86868b}
.gcard--now .cat{color:#ff7aae}
.gcard h3{font-size:30px;line-height:1.08;margin-top:10px;letter-spacing:-.03em}
.gcard p{margin:12px 0 0;font-size:16px;line-height:1.45;color:#86868b}
.gcard.gcard--white p,.gcard.gcard--white .cat,.gcard.gcard--white .foot small{color:var(--ink-3)}
.gcard .art{margin-top:auto;position:relative;height:200px}
.gcard .art .g{position:absolute;width:112px}
.gcard .art .g:nth-child(1){left:6%;bottom:10px;transform:rotate(-8deg)}
.gcard .art .g:nth-child(2){left:36%;bottom:56px;z-index:2;width:128px;transform:rotate(4deg)}
.gcard .art .g:nth-child(3){left:66%;bottom:6px;transform:rotate(10deg)}
.gcard .foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:12px}
.gcard .foot small{font-size:13px;color:#86868b;line-height:1.35}
.gcard .foot small a{color:#ff7aae;font-weight:600}
.plus{flex:none;width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(255,255,255,.16);color:#fff;transition:background-color .25s var(--ease),transform .3s var(--spring)}
.gcard--white .plus{background:#1d1d1f;color:#fff}
.plus:hover{transform:scale(1.08)}
.plus[aria-pressed=true]{background:var(--blue);color:#fff;transform:rotate(45deg)}
.paddles{display:flex;justify-content:flex-end;gap:14px;margin-top:6px}
.paddle{width:44px;height:44px;border-radius:50%;border:0;background:#e8e8ed;color:var(--ink);display:grid;place-items:center;transition:background-color .2s}
.paddle:hover{background:#dcdce1}
.paddle svg{width:20px;height:20px}

/* configurator */
.config{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.config h2{font-size:clamp(36px,4.6vw,56px);line-height:1.05}
.config .lede{font-size:21px;color:var(--ink-2);margin:18px 0 0;max-width:30ch}
.config .sized{margin-top:28px;font:600 15px Inter;color:var(--blue-ink)}
.dials{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dial{border-radius:var(--r-lg);background:var(--mist);padding:20px 20px 16px}
.dial label{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600;color:var(--ink-2)}
.dial .ctl{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.dial input{width:100%;border:0;background:transparent;font:600 54px/1 Oxanium;letter-spacing:-.03em;color:var(--ink);outline:0;padding:0}
.dial input::placeholder{color:#c7c7cc}
.dial .st{display:flex;gap:8px}
.dial .st button{width:36px;height:36px;border-radius:50%;border:0;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.12);font-size:20px;line-height:1;color:var(--ink)}
.dial .st button:hover{background:#fafafa}
.dial small{display:block;margin-top:6px;font-size:13px;color:var(--ink-3)}
.facts{grid-column:1/-1;display:grid;grid-template-columns:1fr;gap:14px}
.facts fieldset{border:0;margin:0;padding:16px 20px;border-radius:var(--r-lg);background:var(--mist)}
.facts legend{float:left;width:100%;font-size:14px;font-weight:600;color:var(--ink-2);margin-bottom:10px}
.facts .opts{display:flex;gap:6px;clear:both}
.facts label{flex:1;position:relative}
.facts input{position:absolute;opacity:0}
.facts span{display:grid;place-items:center;min-height:44px;border-radius:12px;background:#fff;font-size:14px;font-weight:500;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .2s,color .2s;text-align:center;padding:0 6px}
.facts input:checked+span{box-shadow:inset 0 0 0 2px var(--blue);color:var(--ink);font-weight:600}
.facts input:focus-visible+span{outline:2px solid var(--magenta);outline-offset:2px}

/* lineup */
.lineup{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.fcard{background:#fff;border-radius:var(--r-xl);padding:40px 28px 30px;display:flex;flex-direction:column;align-items:center;text-align:center;transition:transform .45s var(--ease),box-shadow .45s var(--ease)}
.fcard:hover{transform:translateY(-4px);box-shadow:0 22px 50px -26px rgba(0,0,0,.3)}
.fcard .g{width:132px;margin-bottom:28px}
.fcard .goal{font:600 12px Oxanium;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.fcard h3{font-size:26px;line-height:1.12;margin-top:8px}
.fcard p{font-size:15px;color:var(--ink-2);margin:12px 0 0;max-width:32ch}
.fcard .out{display:flex;gap:8px;align-items:flex-start;margin:18px 0 0;font-size:14px;font-weight:500;color:var(--ink);text-align:left}
.fcard .out svg{flex:none;color:#1a8f55;width:18px;height:18px;margin-top:1px}
.fcard .acts{margin-top:auto;padding-top:26px;display:flex;align-items:center;gap:22px}
.fcard .pill[aria-pressed=true]{background:#fff;color:var(--blue-ink);box-shadow:inset 0 0 0 1.5px var(--blue)}
.fcard.is-hidden{display:none}
.fcard--help{background:#000;color:#f5f5f7}
.fcard--help p{color:#a1a1a6}

/* why */
.why{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px max(22px,calc((100vw - var(--wrap))/2 + 22px)) 30px 22px;margin:0 calc((100% - 100vw)/2) 0 -22px;scrollbar-width:none}
.why::-webkit-scrollbar{display:none}
.wcard{flex:0 0 330px;min-height:260px;scroll-snap-align:start;background:#1d1d1f;border-radius:var(--r-xl);padding:30px;display:flex;flex-direction:column}
.wcard .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(111,179,255,.14);color:var(--blue-sky)}
.wcard h3{font-size:24px;line-height:1.15;margin-top:auto;padding-top:46px;letter-spacing:-.025em}
.wcard p{margin:10px 0 0;font-size:15px;color:#a1a1a6}
.wcard--keys{background:linear-gradient(160deg,#1d6ff2,#0a2f86)}
.wcard--keys .ic{background:rgba(255,255,255,.18);color:#fff}
.wcard--keys p{color:rgba(255,255,255,.75)}

/* close */
.close{text-align:center;padding:120px 0}
.close h2{font-size:clamp(40px,5.6vw,72px);line-height:1.02;letter-spacing:-.04em}
.close p{font-size:21px;color:var(--ink-2);margin:18px auto 0;max-width:40ch}
.close .ctas{display:flex;justify-content:center;flex-wrap:wrap;gap:16px 26px;margin-top:34px;align-items:center}
.fine{font-size:12.5px;color:var(--ink-3);text-align:center;padding:0 22px 40px;max-width:70ch;margin:0 auto}

/* floating Your Solution */
.bag{position:fixed;left:50%;bottom:22px;z-index:30;transform:translate(-50%,140%);display:flex;align-items:center;gap:18px;padding:10px 10px 10px 22px;border-radius:999px;background:rgba(29,29,31,.86);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);color:#f5f5f7;box-shadow:0 20px 50px -18px rgba(0,0,0,.6);transition:transform .6s var(--spring);max-width:calc(100% - 32px)}
.bag.on{transform:translate(-50%,0)}
.bag .pill,.bag .t b{white-space:nowrap}
.bag .t{font-size:14px;line-height:1.3;min-width:0}
.bag .t b{display:block;font-size:15px}
.bag .t span{color:#a1a1a6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:44ch}

@media (max-width:1068px){
  .hero .wrap{grid-template-columns:1fr;min-height:0;padding-top:56px;padding-bottom:20px}
  .sculpt{height:420px;margin-top:-10px}
  .plane{transform:rotateX(58deg) rotateZ(-38deg) scale(.78)}
  .config{grid-template-columns:1fr;gap:36px}
  .lineup{grid-template-columns:1fr 1fr}
  .lnav nav{display:none}
}
@media (max-width:734px){
  body{font-size:16px}
  .gnav .links{display:none}
  .lnav .wrap{gap:12px}.lnav .pill{margin-left:auto}
  .sec{padding:72px 0}
  .head{flex-direction:column;align-items:flex-start;margin-bottom:28px}.head .aside{text-align:left}
  .sculpt{height:330px}.plane{transform:rotateX(58deg) rotateZ(-38deg) scale(.58)}
  .gcard{flex-basis:300px;height:500px;padding:26px 24px 22px}.gcard h3{font-size:26px}
  .gcard .art .g{width:92px}.gcard .art .g:nth-child(2){width:104px}
  .dials{grid-template-columns:1fr 1fr}.dial input{font-size:40px}.facts{grid-template-columns:1fr}
  .lineup{grid-template-columns:1fr}
  .wcard{flex-basis:280px}
  .paddles{display:none}
  .bag .t span{display:none}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{animation:none!important;transition:none!important}
  .js .rv{opacity:1;transform:none}
}
</style>
</head>
<body>
<header class="gnav" aria-label="Site"><div class="wrap"><img src="digerati-logo-reverse.svg" alt="Digerati Experts"><span class="links"><span>Solutions</span><span>Industries</span><span>Resources</span><span>Pricing</span><span>About</span><span aria-current="page">Store</span><span>Contact</span></span><span class="sp"></span><a href="tel:+13254809870">325-480-9870</a></div></header>
<div class="lnav" role="region" aria-label="Store"><div class="wrap"><b>Store</b>
  <nav aria-label="Store sections"><a href="#situations">Situations</a><a href="#size">Size it</a><a href="#families">Families</a><a href="#why">Why DE</a></nav>
  <a class="pill pill--magenta" href="#" id="lnav-review">Your Solution <span class="count" id="lnav-count">0</span></a></div></div>
<main id="app"></main>
<div class="bag" id="bag" role="region" aria-label="Your Solution"><div class="t"><b id="bag-n">0 needs</b><span id="bag-list"></span></div><a class="pill pill--magenta pill--sm" href="#">Review Your Solution</a></div>
<script src="icons.js"></script><script src="data.js"></script>
<script>
document.documentElement.classList.add("js");
const S = STORE, F = S.families;
const TONE = { productive: "electric", protect: "graphite", requirements: "paper", connect: "electric", modernize: "graphite" };
const goalOf = id => S.goals.find(g => g.f.includes(id));
const glyph = (id, cls = "") => `<span class="g g--${TONE[goalOf(id).id]} ${cls}" aria-hidden="true">${ic(F[id].i, 64)}</span>`;
const order = S.goals.flatMap(g => g.f);
const sculpt = [...order.slice(0, 13), null, null, null].map((id, i) => id ? `<span class="g g--${i===6?"magenta":TONE[goalOf(id).id]}" style="--z:${(i*37)%60}px;--dl:${-(i*0.7)}s">${ic(F[id].i, 64)}</span>` : `<span class="g g--ghost"></span>`).join("");
const GKEY = { now: "Something just happened", grow: "Growing or changing", prove: "Prove it or keep up" };
const chev = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d === "l" ? "m15 18-6-6 6-6" : "m9 18 6-6-6-6"}"/></svg>`;
const plusI = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>`;
document.getElementById("app").innerHTML = `
<section class="hero dark" aria-labelledby="h1">
  <div class="wrap">
    <div>
      <div class="eyebrow rv">${S.hero.eyebrow}</div>
      <h1 id="h1" class="rv" data-d="1">${S.hero.h1a}<em>${S.hero.h1b}</em></h1>
      <p class="rv" data-d="2"><b>Tell us what you have once.</b> Pick what needs attention. DE sizes a solution you can send for a real quote.</p>
      <div class="ctas rv" data-d="3"><a class="pill pill--magenta" href="#situations">Start from a situation</a><a class="link" href="#size">Size it to your business</a></div>
      <p class="note rv" data-d="3">No payment here. Already a client? <a class="link" href="#">Client Marketplace</a></p>
    </div>
    <div class="sculpt" aria-hidden="true"><div class="plane">${sculpt}</div></div>
  </div>
</section>

<section class="sec sec--mist" id="situations" aria-labelledby="sit-h">
  <div class="wrap">
    <div class="head rv"><h2 id="sit-h">Start from a situation. <span>Pick the one that sounds like you.</span></h2><p class="aside">It adds the needs that situation calls for, and you can undo.</p></div>

    <div class="gallery" id="gal" tabindex="0" aria-label="Situations">${S.scenarios.map((s, i) => { const tone = s.g === "now" ? "now" : (i % 2 ? "white" : "black"); return `
      <article class="gcard gcard--${tone} rv" data-g="${s.g}" data-d="${i%3}">
        <div class="cat">${GKEY[s.g]}</div>
        <h3>${s.t}</h3>
        <p>${s.p}</p>

        <div class="foot"><small>${s.inc ? `Happening now? <a href="tel:+13254809870">Call ${S.phone}</a>` : `Adds ${s.f.map(id => F[id].l).join(", ")}`}</small>
          <button class="plus" type="button" aria-pressed="false" aria-label="Add these ${s.f.length}: ${s.t}" data-add='${JSON.stringify(s.f)}'>${plusI}</button></div>

<section class="sec" id="size" aria-labelledby="size-h">
  <div class="wrap config">
    <div class="rv"><div class="eyebrow" style="color:var(--blue-ink)">Step 1 · Profile</div><h2 id="size-h" style="margin-top:14px">Size it once. <span style="color:var(--ink-3)">Every package follows.</span></h2>
      <p class="lede">Four counts and two facts. Skip for now if you like; it is needed before you submit.</p>
      <p class="sized" id="sized" aria-live="polite">Four counts and two facts. Then every package sizes itself.</p></div>
    <div class="dials rv" data-d="1">
      ${[["Users","users","25","At least 1"],["Computers","monitor","30","0 is fine"],["Mobile devices","smartphone","15","Phones and tablets with company email"],["Sites","map-pin","1","Home workers are not sites"]].map(([k,i,ph,h]) => `<div class="dial"><label for="d-${i}">${ic(i,16)}${k}</label><div class="ctl"><input id="d-${i}" inputmode="numeric" placeholder="${ph}" data-k="${k}"><div class="st"><button type="button" aria-label="Fewer ${k.toLowerCase()}" data-step="-1" data-for="d-${i}">−</button><button type="button" aria-label="More ${k.toLowerCase()}" data-step="1" data-for="d-${i}">+</button></div></div><small>${h}</small></div>`).join("")}
      <div class="facts">
        <fieldset><legend>Who owns the devices?</legend><div class="opts">${["The company","People bring their own","A mix"].map((x,i)=>`<label><input type="radio" name="own"><span>${x}</span></label>`).join("")}</div></fieldset>
        <fieldset><legend>Is anyone doing IT inside the company?</legend><div class="opts">${["Yes","No","Not sure"].map(x=>`<label><input type="radio" name="it"><span>${x}</span></label>`).join("")}</div></fieldset>

<section class="sec sec--mist" id="families" aria-labelledby="fam-h">
  <div class="wrap">
    <div class="head rv"><h2 id="fam-h">Explore the families. <span>Thirteen ways to fix what hurts.</span></h2><p class="aside">Open one for the full package, or add it from here.</p></div>
    <div class="seg rv" role="tablist" aria-label="Business goals"><button role="tab" aria-selected="true" data-goal="all">All</button>${S.goals.map(g => `<button role="tab" aria-selected="false" data-goal="${g.id}">${g.l}</button>`).join("")}</div>
    <div class="lineup" id="lineup">${order.map((id, i) => { const f = F[id], g = goalOf(id); return `
      <article class="fcard rv" data-goal="${g.id}" data-d="${i%3}">${glyph(id)}<div class="goal">${g.l}</div><h3>${f.l}</h3><p>${f.d}</p>
        <div class="out">${ic("check",18)}${f.o}</div>
        <div class="acts"><button class="pill pill--blue pill--sm" type="button" aria-pressed="false" data-add='["${id}"]'>Add need</button><a class="link" href="#">Learn more</a></div></article>`; }).join("")}
      <article class="fcard fcard--help dark rv"><span class="g g--magenta" aria-hidden="true" style="width:132px;margin-bottom:28px">${ic("phone-call",64)}</span><div class="goal" style="color:#86868b">Not sure</div><h3>Not sure which one?</h3><p>Tell us what is going on and DE points you at the right families.</p><div class="acts"><a class="pill pill--magenta pill--sm" href="tel:+13254809870">Call ${S.phone}</a></div></article>
    </div>
  </div>

    <div class="why" tabindex="0" role="group" aria-label="Why DE">${[
      ["lock","No payment here.","DE confirms package fit, scope, fulfillment and pricing before you commit.",""],
      ["key-round","Your Technology. Your Data. Your Keys.","You own the environment, the accounts and the documentation. Always.","keys"],
      ["layers","Standalone or co-managed.","Every family comes both ways: DE runs it, or DE works beside your IT team.",""],

      ["file-text","Everything gets written down.","Documented environments, so nothing walks out the door with one person.",""],
      ["phone-call","A person when you need one.",`Call ${S.phone}. Happening right now? Say so first.`,""],
    ].map(([i,h,p,k],n) => `<article class="wcard ${k?"wcard--"+k:""} rv" data-d="${n%3}"><span class="ic">${ic(i,22)}</span><h3>${h}</h3><p>${p}</p></article>`).join("")}</div>

<section class="close" aria-labelledby="close-h"><div class="wrap rv">

</div></section>
<p class="fine">No payment is taken here. DE confirms package fit, scope, fulfillment, and pricing before commitment. Want DE to run all of IT? <a class="link" href="#">Handle Our IT</a></p>`;

/* behaviour */
const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { rootMargin: "0px 0px -8% 0px" }) : null;
document.querySelectorAll(".rv").forEach(el => io ? io.observe(el) : el.classList.add("in"));
const added = new Set();
const sync = () => {
  const n = added.size;
  document.getElementById("lnav-count").textContent = n;
  document.getElementById("bag-n").textContent = n === 1 ? "1 need" : `${n} needs`;
  document.getElementById("bag-list").textContent = [...added].map(id => F[id].l).join(" · ");
  document.getElementById("bag").classList.toggle("on", n > 0);
  document.querySelectorAll("[data-add]").forEach(b => { const ids = JSON.parse(b.dataset.add); const on = ids.every(id => added.has(id)); b.setAttribute("aria-pressed", on); if (b.classList.contains("pill")) b.textContent = on ? "Added ✓" : "Add need"; });
};
document.addEventListener("click", e => {
  const b = e.target.closest("[data-add]"); if (b) { const ids = JSON.parse(b.dataset.add); const all = ids.every(id => added.has(id)); ids.forEach(id => all ? added.delete(id) : added.add(id)); sync(); }
  const p = e.target.closest(".paddle"); if (p) { const g = document.getElementById("gal"); g.scrollBy({ left: +p.dataset.dir * 392, behavior: "smooth" }); }
  const st = e.target.closest("[data-step]"); if (st) { const inp = document.getElementById(st.dataset.for); inp.value = Math.max(0, (+inp.value || 0) + +st.dataset.step); inp.dispatchEvent(new Event("input", { bubbles: true })); }
  const t = e.target.closest(".seg [role=tab]"); if (t) { const seg = t.parentElement; seg.querySelectorAll("[role=tab]").forEach(x => x.setAttribute("aria-selected", x === t)); if (t.dataset.g) document.querySelectorAll(".gcard").forEach(c => c.style.display = t.dataset.g === "all" || c.dataset.g === t.dataset.g ? "" : "none"); if (t.dataset.goal) document.querySelectorAll(".fcard[data-goal]").forEach(c => c.classList.toggle("is-hidden", !(t.dataset.goal === "all" || c.dataset.goal === t.dataset.goal))); }
});
document.addEventListener("input", e => { if (!e.target.dataset.k) return; const v = [...document.querySelectorAll(".dial input")].map(i => [i.dataset.k, i.value]); const missing = v.filter(([, x]) => !x).map(([k]) => k.toLowerCase()); document.getElementById("sized").textContent = missing.length === 4 ? "Four counts and two facts. Then every package sizes itself." : missing.length ? `Missing: ${missing.join(", ")}` : `Sized for ${v.map(([k, x]) => `${x} ${k.toLowerCase()}`).join(" · ")}`; });
</script>
