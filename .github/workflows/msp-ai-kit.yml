name: MSP AI Kit

# The kit lives outside the app's Vitest and tsc scope, so it gets its own checks: the Node
# builder and eval harness on Linux, and the builder again on Windows for paths and line endings.
# The DE Tech Tool's Windows jobs (PSScriptAnalyzer, Pester, WPF smoke, installer lifecycle) moved
# with the tool to the private repo digeratiexperts/de-tech-tool on 2026-11-05.

on:
  pull_request:
    paths:
      - ".claude/skills/msp-ai-kit/**"
      - ".github/workflows/msp-ai-kit.yml"
  push:
    branches: [main]
    paths:
      - ".claude/skills/msp-ai-kit/**"
      - ".github/workflows/msp-ai-kit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msp-ai-kit-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  KIT: .claude/skills/msp-ai-kit

jobs:
  kit:
    name: Builder, evals, facts, installers (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Builder tests
        run: node --test $KIT/scripts/build.test.mjs
      - name: Config and module check
        run: node $KIT/scripts/build.mjs --check
      - name: Committed example is current
        run: node $KIT/scripts/build.mjs --verify $KIT/examples/digerati-experts
      - name: Overlay profile builds
        run: node $KIT/scripts/build.mjs --config $KIT/profiles/example-client-overlay.json --dry-run --quiet
      - name: Company facts match shared/companyContact.ts
        run: node $KIT/scripts/sync-facts.mjs --check
      - name: Eval cases are well formed and golden outputs score
        run: node $KIT/scripts/eval.mjs --score-golden
      - name: Install targets (dry run against a scratch repo)
        run: |
          mkdir -p /tmp/scratch-repo && printf '# Scratch\n' > /tmp/scratch-repo/CLAUDE.md
          node $KIT/scripts/install-targets.mjs --pack $KIT/examples/digerati-experts --repo /tmp/scratch-repo --all
          node $KIT/scripts/install-targets.mjs --pack $KIT/examples/digerati-experts --repo /tmp/scratch-repo --all | grep -c "NO CHANGE" | xargs test 4 -eq
          node $KIT/scripts/install-targets.mjs --pack $KIT/examples/digerati-experts --repo /tmp/scratch-repo --all --remove
      - name: Upstream installer parses and lists
        run: |
          bash -n $KIT/scripts/install-upstream.sh
          bash $KIT/scripts/install-upstream.sh --list
          bash $KIT/scripts/install-upstream.sh --dry-run --only cmmc

  kit-windows:
    name: Kit builder on Windows (paths, line endings)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Kit builder tests on Windows (paths, line endings)
        shell: pwsh
        run: |
          node --test "$env:KIT/scripts/build.test.mjs"
          if ($LASTEXITCODE -ne 0) { throw "builder tests failed on Windows" }
          node "$env:KIT/scripts/build.mjs" --verify "$env:KIT/examples/digerati-experts"
          if ($LASTEXITCODE -ne 0) { throw "example pack drifted on a Windows checkout" }
