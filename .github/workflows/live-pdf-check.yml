# Nightly live check of the PDFs production serves.
#
# CI checks the PDFs a commit would produce (the "Store PDF check" step). This
# checks what production actually serves, which can change without a commit:
# on 2026-10-05 production's Chromium (151) began tagging <strong> as a PDF 2.0
# type, and every order and receipt failed PDF/UA-1 until #480 fixed it.
#
# It renders a solution packet through the live endpoint, fetches every
# resource PDF, and runs scripts/de-documents/lib/verify.py with veraPDF
# PDF/UA-1 (scripts/qa/live_pdf_check.py). A failure opens or updates one
# issue, the same way the deploy-failure and production-health jobs do.
#
# Cost note: the account's Actions budget has "stop usage" enabled (see
# production-health.yml), and an over-run blocks production deploys. This runs
# once a day for about 2-3 billed minutes (~80 a month).
name: Live PDF check

on:
  schedule:
    # Daily at 10:23 UTC (03:23 in Arizona).
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-pdf-check
  cancel-in-progress: false

jobs:
  check:
    name: Verify live PDFs (PDF/UA-1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends poppler-utils python3-pikepdf
          cli="$(bash scripts/qa/install-verapdf.sh "$RUNNER_TEMP/verapdf" | tail -1)"
          echo "VERAPDF=$cli" >> "$GITHUB_ENV"

      - name: Check live PDFs
        run: /usr/bin/python3 scripts/qa/live_pdf_check.py "$RUNNER_TEMP/live-pdfs"

      - name: Upload live PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-pdfs
          path: ${{ runner.temp }}/live-pdfs
          if-no-files-found: ignore
          retention-days: 14

      - name: Open or update the live-PDF issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const MARKER = 'Live PDF check is failing';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let summary = '';
            try {
              summary = require('fs').readFileSync(`${process.env.RUNNER_TEMP}/live-pdfs/summary.md`, 'utf8');
            } catch {
              summary = 'No summary was written: the check failed before verifying (tool install or fetch).';
            }
            const body = [
              `The nightly live PDF check failed on \`${context.sha.slice(0, 8)}\`.`,
              '',
              summary,
              '',
              `Run (PDFs in the \`live-pdfs\` artifact): ${runUrl}`,
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', per_page: 100 });
            const existing = open.find((issue) => !issue.pull_request && issue.title.startsWith(MARKER));
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
              core.notice(`Commented on #${existing.number}`);
              return;
            }
            const created = await github.rest.issues.create({
              ...context.repo,
              title: `${MARKER} (since ${new Date().toISOString().slice(0, 10)})`,
              body: `${body}\n\nClose this issue once the live check passes; it is reused for every later failure while it stays open.`,
            });
            core.notice(`Opened #${created.data.number}`);
