name: Security scan

# Items 326 (SAST each PR) and 327 (dependency review each PR).
# This repo is PUBLIC, so CodeQL and the dependency-review action are available
# without GitHub Advanced Security.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # weekly sweep for advisories published after a PR merged
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL SAST (item 326)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialise CodeQL
        uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyse
        uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          category: /language:javascript-typescript

  dependency-review:
    name: Dependency review (item 327)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Fails the PR when it introduces a dependency with a known vulnerability
      # at or above the severity threshold. Complements the npm audit gate in ci.yml:
      # that scans the resolved tree, this reviews the *change*.
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
