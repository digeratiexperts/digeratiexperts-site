name: Public phone artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/public-phone-artifacts.yml
      - client/public/**/*.pdf
      - public/**/*.pdf
      - document_templates/**
      - artifacts/design-concepts/resource-pdfs/**
      - scripts/public-phone-*
      - scripts/de-documents/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-phone-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install PDF readers
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends poppler-utils python3-pikepdf
      - name: Reject retired phones and callable placeholders
        env:
          PYTHON: /usr/bin/python3
        run: node --test scripts/public-phone-artifacts.test.mjs
