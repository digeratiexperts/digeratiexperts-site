# Production runtime health probe.
#
# On 2026-09-29 production restarted at ~17:33 UTC and came back on
# fallback_memory: the database dropped out of a running service for roughly
# three hours. No deploy failed, so the deploy-failure job stays silent for
# this class of incident. Only /api/health showed it, and only to whoever
# happened to look.
#
# On 2026-09-30 the DE Desk "Get Support" tab had been failing for months: the
# Zoho Desk refresh token was dead (invalid_code) while every health signal
# read green, because nothing exercised the Desk credential. #289 added
# GET /api/zoho/desk/status, which performs one authenticated Desk read with
# the server's own token; this probe reads it so a dead token opens an issue
# the same way a dropped database does.
#
# Cost note: every scheduled run bills at least one Actions minute, and the
# account's Actions budget has "stop usage" enabled — an over-run would block
# production deploys, so the interval is deliberately conservative. Hourly is
# ~720 billed minutes a month (it was every 30 minutes, ~1,440, until
# 2026-10-14). Halve the interval and you double that; change the cron below
# if the trade-off should be different.
name: Production health

on:
  schedule:
    # Hourly, at minute 17 (off the top of the hour, when scheduled runs queue).
    # See the cost note above before making this tighter.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: false

jobs:
  probe:
    name: Probe production runtime health
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Read /api/health
        id: probe
        shell: bash
        run: |
          set -uo pipefail
          URL="https://digeratiexperts.com/api/health"

          # Probe twice before calling it an incident. A single failed request is
          # far more often a transient network blip than a real outage, and an
          # alert nobody trusts is worse than no alert.
          probe_once() {
            curl -fsS --max-time 20 "$URL" 2>/dev/null
          }

          # jq given an empty body prints nothing and still exits 0, so a `||`
          # fallback never fires and the field silently becomes "". Default on the
          # captured value instead, or an unreachable site reports a blank state.
          field() {
            local value
            value="$(printf '%s' "$BODY" | jq -r "$1 // empty" 2>/dev/null || true)"
            printf '%s' "${value:-$2}"
          }

          BODY="$(probe_once || true)"
          DB="$(field '.services.database' 'unreachable')"

          if [ "$DB" != "connected" ]; then
            echo "First probe reported '$DB'; re-checking in 30s before alerting."
            sleep 30
            BODY="$(probe_once || true)"
            DB="$(field '.services.database' 'unreachable')"
          fi

          # /healthz (server/healthProbe.ts) is the cheap liveness probe: 200 when
          # the pool handed out a connection, 503 when it could not, and it never
          # waits on the Zoho token store. It is read once, after both /api/health
          # probes, so it describes a moment up to ~70 s later. When /api/health sends no body, this
          # tells "the process is up but the API stalled" from "the database is
          # down" from "the site is down" (2026-10-20, #657: nine hours of
          # "unreachable" with no body while /healthz answered 503 in 0.3 s).
          # The app answers text/plain "ok" (200) or "unavailable" (503). The
          # OpenLiteSpeed hop in front of it also answers 503 when the process
          # is down, so classify only on the app's own body; anything else
          # stays "unreachable".
          HZ="$(curl -sS --max-time 20 -w '\n%{http_code}' "https://digeratiexperts.com/healthz" 2>/dev/null || printf '\n000')"
          HEALTHZ="$(printf '%s' "${HZ##*$'\n'}" | tr -cd '0-9' | head -c 3)"
          HEALTHZ="${HEALTHZ:-000}"
          HZ_BODY="$(printf '%s' "${HZ%$'\n'*}" | tr -d '\r\n' | head -c 32)"
          if [ -z "$BODY" ]; then
            case "$HEALTHZ:$HZ_BODY" in
              200:ok) DB="stalled" ;;
              503:unavailable) DB="unavailable" ;;
            esac
          fi

          STATUS="$(field '.status' 'unknown')"
          UPTIME="$(field '.uptime' 'unknown')"

          # Second probe: the support desk. The endpoint answers 503 with a
          # JSON body when the desk is unreachable, so curl -f would discard
          # the diagnosis; read the body regardless of status. Same two-probe
          # rule; the endpoint caches for 60s, so wait longer than that.
          DESK_URL="https://digeratiexperts.com/api/zoho/desk/status"
          desk_once() {
            curl -sS --max-time 20 "$DESK_URL" 2>/dev/null
          }
          DESK_BODY="$(desk_once || true)"
          desk_field() {
            local value
            value="$(printf '%s' "$DESK_BODY" | jq -r "$1 // empty" 2>/dev/null || true)"
            printf '%s' "${value:-$2}"
          }
          # `// empty` would swallow a JSON false (jq treats false as absent),
          # so the boolean goes through tostring: "true", "false", or "null".
          DESK="$(desk_field '.connected | tostring' 'unreachable')"
          if [ "$DESK" != "true" ]; then
            echo "First desk probe reported connected='$DESK'; re-checking in 75s (the endpoint caches for 60s)."
            sleep 75
            DESK_BODY="$(desk_once || true)"
            DESK="$(desk_field '.connected | tostring' 'unreachable')"
          fi
          DESK_REASON="$(desk_field '.reason' 'none')"
          # connected / degraded (throttled or unreachable, retrying, no new
          # token) / needs_reconnect (Zoho refused the credential) / not_configured.
          DESK_STATE="$(desk_field '.state' 'none')"
          DESK_ERROR="$(desk_field '.errorCode' 'none')"
          # true when the status route gave up waiting on its own probe (15 s):
          # a database or Zoho stall, not a credential problem.
          DESK_TIMED_OUT="$(desk_field '.timedOut | tostring' 'false')"

          # Everything below treats the response as untrusted, because a workflow
          # output is a command channel. A value carrying a newline ends the
          # key=value line early, and a heredoc whose delimiter appears in the
          # body terminates early — either lets remote content write its own
          # workflow commands. Ours is a friendly endpoint today; monitoring code
          # should not depend on that.

          # Scalars: single line, bounded length.
          scalar() { printf '%s' "$1" | tr -d '\r\n' | head -c 64; }
          DB="$(scalar "$DB")"
          STATUS="$(scalar "$STATUS")"
          UPTIME="$(scalar "$UPTIME")"
          DESK="$(scalar "$DESK")"
          DESK_REASON="$(scalar "$DESK_REASON")"
          DESK_STATE="$(scalar "$DESK_STATE")"
          DESK_ERROR="$(scalar "$DESK_ERROR")"
          DESK_TIMED_OUT="$(scalar "$DESK_TIMED_OUT")"
          HEALTHZ="$(scalar "$HEALTHZ")"

          # Body: capped, then base64 on one line, so there is no delimiter to
          # break out of and no size that can produce an unreadable issue.
          BODY_RAW="${BODY:-(no response body)}"
          BODY_CAPPED="$(printf '%s' "$BODY_RAW" | head -c 2000)"
          TRUNCATED=false
          [ "${#BODY_RAW}" -gt 2000 ] && TRUNCATED=true

          echo "database=$DB"     >> "$GITHUB_OUTPUT"
          echo "status=$STATUS"   >> "$GITHUB_OUTPUT"
          echo "uptime=$UPTIME"   >> "$GITHUB_OUTPUT"
          echo "truncated=$TRUNCATED" >> "$GITHUB_OUTPUT"
          echo "body_b64=$(printf '%s' "$BODY_CAPPED" | base64 -w0)" >> "$GITHUB_OUTPUT"
          echo "desk=$DESK"               >> "$GITHUB_OUTPUT"
          echo "desk_reason=$DESK_REASON" >> "$GITHUB_OUTPUT"
          echo "desk_state=$DESK_STATE"   >> "$GITHUB_OUTPUT"
          echo "desk_error=$DESK_ERROR"   >> "$GITHUB_OUTPUT"
          echo "desk_timed_out=$DESK_TIMED_OUT" >> "$GITHUB_OUTPUT"
          echo "healthz=$HEALTHZ"         >> "$GITHUB_OUTPUT"

          echo "database=$DB status=$STATUS uptime=$UPTIME truncated=$TRUNCATED desk=$DESK reason=$DESK_REASON state=$DESK_STATE error=$DESK_ERROR timed_out=$DESK_TIMED_OUT healthz=$HEALTHZ"

      - name: File or clear the health issue
        uses: actions/github-script@v7
        env:
          DB: ${{ steps.probe.outputs.database }}
          STATUS: ${{ steps.probe.outputs.status }}
          UPTIME: ${{ steps.probe.outputs.uptime }}
          BODY_B64: ${{ steps.probe.outputs.body_b64 }}
          TRUNCATED: ${{ steps.probe.outputs.truncated }}
          DESK: ${{ steps.probe.outputs.desk }}
          DESK_REASON: ${{ steps.probe.outputs.desk_reason }}
          DESK_STATE: ${{ steps.probe.outputs.desk_state }}
          DESK_ERROR: ${{ steps.probe.outputs.desk_error }}
          DESK_TIMED_OUT: ${{ steps.probe.outputs.desk_timed_out }}
          HEALTHZ: ${{ steps.probe.outputs.healthz }}
        with:
          script: |
            const MARKER = 'Production database is not connected';
            const DESK_MARKER = 'Production support desk is unreachable';
            const { DB, STATUS, UPTIME, BODY_B64, TRUNCATED, DESK, DESK_REASON, DESK_STATE, DESK_ERROR, DESK_TIMED_OUT, HEALTHZ } = process.env;

            // Decoded here rather than passed raw: see the probe step's note on
            // why the body never travels through a delimiter.
            let BODY = '(could not decode response body)';
            try {
              BODY = Buffer.from(BODY_B64 || '', 'base64').toString('utf8');
            } catch (error) {
              core.warning(`Could not decode the captured body: ${error.message}`);
            }
            // Fence the body so a response containing ``` cannot break the layout.
            BODY = BODY.replace(/`/g, "'");
            if (TRUNCATED === 'true') BODY += '\n… truncated at 2000 bytes.';
            const healthy = DB === 'connected';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', per_page: 100,
            });
            const existing = open.find((issue) => !issue.pull_request && issue.title.startsWith(MARKER));

            const deskHealthy = DESK === 'true';
            const deskExisting = open.find((issue) => !issue.pull_request && issue.title.startsWith(DESK_MARKER));

            // --- the support desk -------------------------------------------
            if (deskHealthy) {
              if (deskExisting) {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: deskExisting.number,
                  body: `Recovered: \`GET /api/zoho/desk/status\` reads \`connected: true\` again.\n\nRun: ${runUrl}`,
                });
                await github.rest.issues.update({
                  ...context.repo, issue_number: deskExisting.number, state: 'closed',
                });
                core.notice(`Desk recovered; closed #${deskExisting.number}`);
              }
            } else {
              const deskBody = [
                `\`GET /api/zoho/desk/status\` reads **\`connected: ${DESK}\`** (state \`${DESK_STATE}\`, reason \`${DESK_REASON}\`, Zoho errorCode \`${DESK_ERROR}\`, timed out \`${DESK_TIMED_OUT}\`). Confirmed by a second probe 75s after the first.`,
                '',
                ...(DESK_TIMED_OUT === 'true'
                  ? ['`timedOut: true`: the status route gave up waiting on its own probe after 15 s. That is a database or Zoho stall behind the probe, not a credential problem; do not reconnect on this alone. See `/healthz` and `services.database` above.', '']
                  : []),
                DESK_STATE === 'degraded'
                  ? 'State `degraded`: Zoho is throttling the server or is unreachable. The credential is fine and the server retries on its own with a backoff; do not generate a new token. This issue closes itself when Zoho answers again.'
                  : 'The site keeps serving pages. The DE Desk **Get Support** tab sends tickets through the fallback (email into the Desk, replayed later) until the Desk API works again. State `needs_reconnect` (reason `auth_failed`) means Zoho refused the credential: follow the reconnect runbook in `docs/ZOHO-OAUTH-INVENTORY.md`. Rotating it is an operator action, never a code change.',
                '',
                `Run: ${runUrl}`,
              ].join('\n');
              if (deskExisting) {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: deskExisting.number, body: deskBody,
                });
                core.notice(`Desk still unreachable; commented on #${deskExisting.number}`);
              } else {
                const created = await github.rest.issues.create({
                  ...context.repo,
                  title: `${DESK_MARKER} (${DESK_REASON})`,
                  body: `${deskBody}\n\nThis issue closes itself once a later probe sees \`connected: true\`.`,
                });
                core.notice(`Opened #${created.data.number}`);
              }
            }

            // --- the database ----------------------------------------------
            if (healthy) {
              // Close on recovery so an open issue always means "broken right now".
              if (existing) {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: existing.number,
                  body: `Recovered: \`services.database\` reads \`connected\` again (uptime ${UPTIME}s).\n\nRun: ${runUrl}`,
                });
                await github.rest.issues.update({
                  ...context.repo, issue_number: existing.number, state: 'closed',
                });
                core.notice(`Recovered; closed #${existing.number}`);
              }
            } else {
              const noBody = DB === 'stalled' || DB === 'unavailable';
              const body = [
                noBody
                  ? `\`/api/health\` returned no 2xx body on two probes 30s apart; \`/healthz\` answered \`${HEALTHZ}\` (\`${DB}\`).`
                  : `\`services.database\` reads **\`${DB}\`**, not \`connected\`. Confirmed by a second probe 30s after the first.`,
                '',
                `Top-level status: \`${STATUS}\` · process uptime: \`${UPTIME}\`s · \`/healthz\`: \`${HEALTHZ}\``,
                '',
                ...(DB === 'stalled'
                  ? ['The process is up and answered `/healthz` with `ok` (a pooled connection was handed out), but `/api/health` sent no body within 20s: a read behind it is hanging. The 30 s query cap (server/dbPoolOptions.ts) should clear it on its own; if the next probe still reads stalled, restart the service and fix the code path that hung.', '']
                  : DB === 'unavailable'
                    ? ['The process is up and answered `/healthz` itself with `unavailable` (503): Postgres is not accepting connections. The app retries the connection on its own and goes green when the database answers.', '']
                    : []),
                ...(DB === 'stalled' ? [] : ['The site keeps serving pages, so this is invisible from the homepage. What breaks is anything durable — portal auth, store orders, quote submissions, chat persistence — and on `fallback_memory` those writes go to memory and are lost on the next restart.', '']),
                '```json',
                BODY,
                '```',
                '',
                `Run: ${runUrl}`,
              ].join('\n');

              if (existing) {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: existing.number, body,
                });
                core.notice(`Still unhealthy; commented on #${existing.number}`);
              } else {
                const created = await github.rest.issues.create({
                  ...context.repo,
                  title: `${MARKER} (${DB})`,
                  body: `${body}\n\nThis issue closes itself once a later probe sees \`connected\`.`,
                });
                core.notice(`Opened #${created.data.number}`);
              }
            }

            const failures = [];
            if (!healthy) failures.push(`services.database is "${DB}", expected "connected"`);
            if (!deskHealthy) failures.push(`desk connected is "${DESK}" (${DESK_REASON}/${DESK_ERROR}), expected "true"`);
            if (failures.length) core.setFailed(failures.join('; '));

      # The two canonical hosts people actually open (AGENTS.md "Hosts"). The
      # probes above read API endpoints on the apex; this checks the site root
      # and the portal login through Cloudflare, each answering 200 directly
      # (no redirect followed, so a redirect loop or a moved login shows up).
      # Same two-probe rule before failing. Runs even when the step above
      # failed, so one broken signal never hides another.
      - name: Probe canonical hosts
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for url in "https://digeratiexperts.com/" "https://portal.digeratiexperts.com/portal/login"; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url" 2>/dev/null || true)"
            if [ "$code" != "200" ]; then
              echo "First probe of $url answered '$code'; re-checking in 30s."
              sleep 30
              code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url" 2>/dev/null || true)"
            fi
            code="$(printf '%s' "$code" | tr -cd '0-9' | head -c 3)"
            if [ "$code" = "200" ]; then
              echo "$url -> 200"
            else
              echo "::error::$url answered '${code:-no response}', expected 200 (confirmed by a second probe)."
              failed=1
            fi
          done
          exit "$failed"
