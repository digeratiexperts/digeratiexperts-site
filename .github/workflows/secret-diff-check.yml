name: Secret diff check

# Cheap guard: reads only the lines a PR or push adds. No install, no cache,
# one short job. Fails when an added line looks like a Zoho 1000.* token,
# sk-*, ghp_* / github_pat_*, a private key, or a hard-coded secret value.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-diff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  added-lines:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch base commit
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "${BASE//0/}" != "" ]; then
            git fetch --no-tags --depth=1 origin "$BASE"
          fi
          echo "BASE=$BASE" >> "$GITHUB_ENV"

      - name: Reject added secrets
        run: node scripts/security/check-added-secrets.mjs "$BASE" HEAD
