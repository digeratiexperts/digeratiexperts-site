# TEMPORARY diagnostic: never merge. Runs on this PR only, prints the NAMES of
# the secrets workflows in this repository can see (never values) and the
# repository's environments, to find why CLOUDFLARE_API_TOKEN / CLOUDFLARE_ZONE_ID
# read empty in the deploy job.
name: Secrets diagnostic (temporary)

on:
  pull_request:
    paths:
      - .github/workflows/secrets-diagnostic.yml

permissions:
  contents: read

jobs:
  names:
    runs-on: ubuntu-latest
    steps:
      - name: List visible secret names (values are never printed)
        uses: actions/github-script@v7
        env:
          SECRET_JSON: ${{ toJSON(secrets) }}
        with:
          script: |
            const names = Object.keys(JSON.parse(process.env.SECRET_JSON || "{}")).sort();
            core.info(`Secret names visible to workflows here: ${names.join(", ") || "none"}`);
            for (const n of ["CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ZONE_ID"]) {
              core.info(`${n}: ${names.includes(n) ? "present" : "MISSING"}`);
            }
            const near = names.filter((n) => /cloud|flare|cf|zone|token/i.test(n) && n !== "github_token");
            core.info(`Similar names: ${near.join(", ") || "none"}`);
            try {
              const { data } = await github.request("GET /repos/{owner}/{repo}/environments", context.repo);
              core.info(`Environments: ${(data.environments || []).map((e) => e.name).join(", ") || "none"}`);
            } catch (e) {
              core.info(`Environments: not readable with this token (${e.status})`);
            }
