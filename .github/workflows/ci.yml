name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-test-build:
    name: Baseline typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      # msp-advisor uses the node:test runner, so it is excluded from Vitest
      # collection and needs its own step to stay covered.
      - name: MSP advisor tests
        run: npm run test:advisor

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npm exec -- playwright install --with-deps chromium

      - name: Playwright release smoke
        run: npm run test:e2e:smoke

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  desktop-build:
    name: Desktop build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm --prefix desktop ci --no-audit --no-fund

      - name: Audit desktop dependencies
        run: npm --prefix desktop audit --audit-level=high

      - name: Test desktop security boundary
        run: npm --prefix desktop test

      - name: Package desktop directory
        run: npm --prefix desktop run package:dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
