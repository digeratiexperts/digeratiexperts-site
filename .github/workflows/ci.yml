name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PR validation can cancel stale runs. Push/dispatch runs use their run ID so
# an offline production runner never blocks newer main CI from starting.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-test-build:
    name: Typecheck, test, build, audit, and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Validate agent claim register
        run: npm run check:active-work

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      # msp-advisor uses the node:test runner, so it is excluded from Vitest
      # collection and needs its own step to stay covered.
      - name: MSP advisor tests
        run: npm run test:advisor

      # The MSP AI Kit skill (.claude/skills/msp-ai-kit) is outside Vitest's
      # include patterns too; its builder tests and config check run here so a
      # module edit without a rebuilt example cannot merge green. The Windows
      # loader has its own workflow (msp-ai-kit.yml).
      - name: MSP AI Kit tests
        run: npm run test:msp-ai-kit

      # The Recraft icon skill's cleaner and request builder, offline (stubbed API, no key).
      - name: Recraft icon skill tests
        run: npm run test:recraft-icons

      - name: Production build
        run: npm run build

      - name: Browser bundle budget
        run: node scripts/check-bundle-budget.mjs

      - name: Local production smoke
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/digerati-ci-production.log
          # The production build fails closed without a JWT secret and (since the
          # MFA crypto landed) without an MFA encryption key; give the smoke run
          # ephemeral ones and explicitly allow memory-only DB. Neither value
          # leaves this job.
          NODE_ENV=production PORT=3300 \
            JWT_SECRET="$(openssl rand -hex 32)" \
            MFA_ENCRYPTION_KEY="$(openssl rand -hex 32)" \
            DE_SMOKE_ALLOW_MEMORY_ONLY=1 \
            node dist/index.js >"$LOG" 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3300/healthz >/dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "$READY" != "1" ]; then
            echo "Production server did not become healthy"
            cat "$LOG"
            exit 1
          fi

          BASE_URL=http://127.0.0.1:3300 npm run smoke:public
          DOOR2_BASE=http://127.0.0.1:3300 npm run smoke:door2
          DESK_BASE=http://127.0.0.1:3300 npm run smoke:desk
          # axe-core WCAG A/AA scan of the settled page; fails on "critical" or
          # "serious", reports the rest (docs/CONTENT-TOOLING-PLAN.md).
          A11Y_BASE=http://127.0.0.1:3300 npm run smoke:a11y

  # Production is a CyberPanel/OpenLiteSpeed VPS, not a Replit deployment.
  # This job is pinned to a repo-scoped production runner. Generic Linux
  # self-hosted runners (RackNerd security runner, Zorin laptop, etc.) are not
  # eligible, preventing accidental cross-project execution.
  deploy-production:
    name: Deploy and verify production VPS
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: check-test-build
    runs-on: [self-hosted, Linux, X64, de-production, website-prod]
    timeout-minutes: 30
    concurrency:
      group: de-production-website
      cancel-in-progress: false

    steps:
      # If the production runner was offline for several merges, old deploy jobs
      # may be waiting. They should not redeploy repeatedly when the runner returns.
      - name: Coalesce stale deployment runs
        shell: bash
        run: |
          set -euo pipefail
          LATEST_SHA="$(git ls-remote https://github.com/digeratiexperts/digeratiexperts-site.git refs/heads/main | awk '{print $1}')"
          test -n "$LATEST_SHA"
          echo "Workflow SHA: $GITHUB_SHA"
          echo "Latest main:  $LATEST_SHA"
          if [ "$GITHUB_SHA" != "$LATEST_SHA" ]; then
            echo "DE_DEPLOY_STALE=true" >> "$GITHUB_ENV"
            echo "This is a stale deployment run; a newer main run will deploy instead."
          else
            echo "DE_DEPLOY_STALE=false" >> "$GITHUB_ENV"
          fi

      - name: Assert runner is the DE production host
        if: env.DE_DEPLOY_STALE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner host: $(hostname)"
          echo "Runner user: $(id -un)"

          SITE=/home/digeratiexperts.com
          DEPLOY="$SITE/current/deploy/vps/deploy.sh"

          test -d "$SITE" || {
            echo "::error::This runner is not on the DE production VPS: $SITE is missing."
            exit 1
          }
          test -f "$DEPLOY" || {
            echo "::error::Canonical production deploy script is missing: $DEPLOY"
            exit 1
          }

          LOAD_STATE="$(systemctl show -p LoadState --value digeratiexperts-site 2>/dev/null || true)"
          test "$LOAD_STATE" = "loaded" || {
            echo "::error::digeratiexperts-site systemd unit is not loaded on this runner host."
            exit 1
          }

          if [ "$(id -un)" = "diger7051" ]; then
            echo "DE_DEPLOY_AS=site-user" >> "$GITHUB_ENV"
          elif [ "$(id -u)" = "0" ]; then
            echo "DE_DEPLOY_AS=root" >> "$GITHUB_ENV"
          elif sudo -n -u diger7051 true 2>/dev/null; then
            echo "DE_DEPLOY_AS=sudo-site-user" >> "$GITHUB_ENV"
          else
            echo "::error::Runner is on the production VPS but cannot execute as diger7051. Use scripts/setup-github-runner.sh with RUNNER_USER=diger7051, or grant only the required sudo-as-diger7051 deployment command."
            exit 1
          fi

      # deploy.sh writes the commit it serves to release.txt. Read the release
      # being replaced, so the Cloudflare purge below knows which public files
      # changed. Unreadable is fine: the purge then clears the whole zone.
      - name: Record the release being replaced
        if: env.DE_DEPLOY_STALE != 'true'
        shell: bash
        run: |
          set -uo pipefail
          PREV="$(curl -fsS --max-time 10 http://127.0.0.1:3300/release.txt 2>/dev/null | tr -d '\r\n' || true)"
          if [[ "$PREV" =~ ^[0-9a-f]{40}$ ]]; then
            echo "DE_PREVIOUS_RELEASE=$PREV" >> "$GITHUB_ENV"
            echo "Replacing release $PREV"
          else
            echo "No readable previous release; the cache purge will clear the whole zone."
          fi

      # Deploy exactly the commit this run's checks passed on (#391). main can
      # advance between the stale check above and deploy.sh's fetch; pinning
      # DEPLOY_COMMIT means that newer commit waits for its own green run.
      - name: Deploy the CI-tested commit with canonical release script
        if: env.DE_DEPLOY_STALE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Unexpected GITHUB_SHA '$GITHUB_SHA'"; exit 1; }
          CMD="DEPLOY_BRANCH=main DEPLOY_COMMIT=$GITHUB_SHA bash /home/digeratiexperts.com/current/deploy/vps/deploy.sh production"
          case "$DE_DEPLOY_AS" in
            site-user)
              bash -lc "$CMD"
              ;;
            root)
              sudo -u diger7051 bash -lc "$CMD"
              ;;
            sudo-site-user)
              sudo -n -u diger7051 bash -lc "$CMD"
              ;;
            *)
              echo "::error::Unknown deployment execution mode"
              exit 1
              ;;
          esac

      - name: Verify production runtime
        if: env.DE_DEPLOY_STALE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:3300/healthz
          curl -fsS https://digeratiexperts.com/healthz

          # The release now serving must be the commit this run tested (#391).
          LOCAL_RELEASE="$(curl -fsS --max-time 10 http://127.0.0.1:3300/release.txt | tr -d '\r\n')"
          PUBLIC_RELEASE="$(curl -fsS --max-time 15 "https://digeratiexperts.com/release.txt?ts=$(date +%s)" | tr -d '\r\n')"
          echo "Tested:  $GITHUB_SHA"
          echo "Local:   $LOCAL_RELEASE"
          echo "Public:  $PUBLIC_RELEASE"
          if [ "$LOCAL_RELEASE" != "$GITHUB_SHA" ] || [ "$PUBLIC_RELEASE" != "$GITHUB_SHA" ]; then
            echo "::error::Production serves ${LOCAL_RELEASE:-<none>} (public ${PUBLIC_RELEASE:-<none>}), not the tested $GITHUB_SHA"
            exit 1
          fi
          echo "DE_DEPLOYED_RELEASE=$LOCAL_RELEASE" >> "$GITHUB_ENV"

          URL="https://digeratiexperts.com/api/portal/zoho/chat/status"
          BODY="$(curl -fsS --max-time 15 "$URL")"
          printf '%s\n' "$BODY"

          printf '%s' "$BODY" | grep -q '"version":"de-intelligence-v1"'
          printf '%s' "$BODY" | grep -q '"enabled":true'
          printf '%s' "$BODY" | grep -Eq '"publicGovernedRecords":[1-9][0-9]*'
          echo "Production is serving DE Intelligence v1"

      # Cloudflare caches public files under their unchanging names (the resource
      # PDFs, covers, fonts), so without a purge a deploy that changes one keeps
      # serving the old copy from the edge. On 2026-10-03 three redesigned PDFs
      # stayed stale this way until a manual purge. Purge exactly the
      # client/public files changed since the release being replaced, and the
      # whole zone when that list cannot be known. Needs the repository secrets
      # CLOUDFLARE_API_TOKEN (Zone > Cache Purge > Purge, digeratiexperts.com only)
      # and CLOUDFLARE_ZONE_ID; without them it warns and skips.
      - name: Purge Cloudflare cache for changed public files
        if: env.DE_DEPLOY_STALE != 'true'
        uses: actions/github-script@v7
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        with:
          script: |
            const token = process.env.CF_API_TOKEN;
            const zone = process.env.CF_ZONE_ID;
            if (!token || !zone) {
              core.warning("CLOUDFLARE_API_TOKEN / CLOUDFLARE_ZONE_ID are not set, so the Cloudflare cache was not purged. Changed public files may be served stale.");
              return;
            }
            const SITE = "https://digeratiexperts.com";
            const PUBLIC = "client/public/";
            const prev = process.env.DE_PREVIOUS_RELEASE || "";
            // The release actually serving (asserted equal to the tested SHA
            // above), so files from any other commit cannot be missed (#391).
            const head = process.env.DE_DEPLOYED_RELEASE || context.sha;
            if (prev === head) {
              core.info("Same release redeployed; nothing to purge.");
              return;
            }

            // null = the changed-file list is unknown, so purge everything.
            let urls = null;
            if (prev) {
              try {
                const { data } = await github.rest.repos.compareCommitsWithBasehead({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  basehead: `${prev}...${head}`,
                  // Paginates commits only; the file list arrives complete on page 1 (up to 300).
                  per_page: 1,
                });
                const files = data.files ?? [];
                // The compare API lists at most 300 files; past that the list is partial.
                if (files.length < 300) {
                  const paths = new Set();
                  for (const f of files) {
                    for (const name of [f.filename, f.previous_filename]) {
                      if (name && name.startsWith(PUBLIC)) paths.add(name.slice(PUBLIC.length));
                    }
                  }
                  urls = [...paths].map((p) => `${SITE}/${encodeURI(p)}`);
                } else {
                  core.info("300 or more files changed; purging the whole zone.");
                }
              } catch (err) {
                core.warning(`Could not compare ${prev}...${head} (${err.message}); purging the whole zone.`);
              }
            }

            const purge = async (body) => {
              const res = await fetch(`https://api.cloudflare.com/client/v4/zones/${zone}/purge_cache`, {
                method: "POST",
                headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
                body: JSON.stringify(body),
              });
              const json = await res.json().catch(() => ({}));
              if (!res.ok || !json.success) {
                throw new Error(`Cloudflare purge failed (HTTP ${res.status}): ${JSON.stringify(json.errors ?? json)}`);
              }
            };

            try {
              if (urls === null) {
                await purge({ purge_everything: true });
                await core.summary.addHeading("Cloudflare cache", 3).addRaw("Purged the whole zone.").write();
                core.info("Purged the whole Cloudflare zone.");
              } else if (urls.length === 0) {
                core.info("No client/public files changed; nothing to purge.");
              } else {
                // Purge-by-URL takes at most 30 URLs per call.
                for (let i = 0; i < urls.length; i += 30) await purge({ files: urls.slice(i, i + 30) });
                await core.summary
                  .addHeading("Cloudflare cache", 3)
                  .addRaw(`Purged ${urls.length} changed public file(s):`)
                  .addList(urls)
                  .write();
                core.info(`Purged ${urls.length} URL(s):\n${urls.join("\n")}`);
              }
            } catch (err) {
              core.setFailed(`${err.message}. The deploy itself succeeded; purge the changed files by hand in Cloudflare.`);
            }

  # Four production deploys failed between 2026-09-19 and 2026-09-27 and produced
  # no signal at all; the gap was found by hand eight days later. This job runs on
  # a GitHub-hosted runner, so it still reports when the production runner itself
  # is the thing that is broken, and it files against one rolling issue rather
  # than opening a new one per failure.
  notify-deploy-failure:
    name: Report a failed production deploy
    needs: deploy-production
    if: always() && needs.deploy-production.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Open or update the deploy-failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const MARKER = 'Production deploy is failing';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Name the steps that actually failed, so the issue is actionable without opening the run.
            let failed = [];
            try {
              const { data } = await github.rest.actions.listJobsForWorkflowRun({
                ...context.repo, run_id: context.runId, per_page: 100,
              });
              for (const job of data.jobs) {
                for (const step of job.steps || []) {
                  if (step.conclusion === 'failure') failed.push(`${job.name} → ${step.name}`);
                }
              }
            } catch (error) {
              core.warning(`Could not read the run's jobs: ${error.message}`);
            }

            const body = [
              `Production deploy failed on \`${context.sha.slice(0, 8)}\` (${context.eventName}).`,
              '',
              failed.length ? `Failing step(s):\n${failed.map((f) => `- \`${f}\``).join('\n')}` : 'No failing step was reported — the job may have been cancelled or the runner lost.',
              '',
              `Run: ${runUrl}`,
              '',
              'Production is still serving the previous release: the deploy script applies migrations before it flips the `current` symlink, so a failure here leaves the running application untouched.',
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', per_page: 100,
            });
            const existing = open.find((issue) => !issue.pull_request && issue.title.startsWith(MARKER));

            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
              core.notice(`Commented on #${existing.number}`);
              return;
            }

            const created = await github.rest.issues.create({
              ...context.repo,
              title: `${MARKER} (since ${new Date().toISOString().slice(0, 10)})`,
              body: `${body}\n\nClose this issue once a production deploy succeeds; it is reused for every later failure while it stays open.`,
            });
            core.notice(`Opened #${created.data.number}`);
