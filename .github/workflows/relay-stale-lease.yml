name: relay-stale-lease

# Agent Relay (Intelligence-Hub docs/AGENT-RELAY.md): a relay:active issue with no RELAY comment and no push to
# its branch for STALE_HOURS is flipped to relay:handoff, so another agent can take it over.
# Labels and one comment only; it never touches code, branches or PRs.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: relay-stale-lease
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        env:
          STALE_HOURS: "3"
        with:
          script: |
            const staleMs = Number(process.env.STALE_HOURS) * 3600 * 1000;
            const now = Date.now();
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'relay,relay:active', per_page: 100,
            });
            for (const issue of issues) {
              if (issue.pull_request) continue;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: issue.number, per_page: 100,
              });
              const relay = comments.filter(c => /^\s*RELAY (CLAIM|PULSE|HANDOFF|REVIEW)/.test(c.body || ''));
              let last = relay.length ? Date.parse(relay[relay.length - 1].created_at) : Date.parse(issue.created_at);
              // The latest comment naming a branch decides which branch to check for pushes.
              let branch = null;
              for (const c of [...relay].reverse()) {
                const m = (c.body || '').match(/Branch:\s*`([^`]+)`/);
                if (m) { branch = m[1]; break; }
              }
              if (branch) {
                try {
                  const { data } = await github.rest.repos.getBranch({ owner, repo, branch });
                  const pushed = Date.parse(data.commit.commit.committer.date);
                  if (pushed > last) last = pushed;
                } catch (e) {
                  core.info(`#${issue.number}: branch ${branch} not found on ${repo} (${e.status})`);
                }
              }
              const idleH = ((now - last) / 3600000).toFixed(1);
              if (now - last < staleMs) { core.info(`#${issue.number}: live (${idleH}h idle)`); continue; }
              const holders = issue.labels.map(l => l.name).filter(n => n.startsWith('agent:'));
              for (const name of ['relay:active', ...holders]) {
                try { await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name }); } catch (e) {}
              }
              await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ['relay:handoff'] });
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `RELAY LEASE EXPIRED · no RELAY comment or push for ${idleH}h (limit ${process.env.STALE_HOURS}h). ` +
                      `Previous holder: ${holders.join(', ') || 'unknown'}. Any agent may take over with a RELAY CLAIM ` +
                      `(\`Takeover of: ...\`), starting from the last pushed SHA${branch ? ` on \`${branch}\`` : ''}. ` +
                      `If there is no RELAY HANDOFF above, write one first from what is on the branch.`,
              });
              core.notice(`#${issue.number}: lease expired after ${idleH}h -> relay:handoff`);
            }
