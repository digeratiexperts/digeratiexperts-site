  :root { --de-bg:#050312; --de-surface:#0a0a0a; --de-raised:#151217; --de-hairline:rgba(255,255,255,0.1); --de-paper:#f7f5f2; --de-paper-raised:#ffffff; --de-paper-hairline:rgba(26,18,16,0.1); }
  html[data-tone="dark"] body { background: var(--de-bg); color: #fff; }
  html[data-tone="paper"] body { background: var(--de-paper); color: #1a1228; }
  body { margin: 0; font-family: "Inter", system-ui, sans-serif; }
  .g-wrap { max-width: 80rem; margin-inline: auto; padding: 2rem clamp(1rem, 4vw, 3rem) 5rem; }
  h1 { font-family: "Space Grotesk", sans-serif; font-size: 1.6rem; margin: 0 0 .3rem; letter-spacing: -.02em; }
  .g-lede { opacity: .6; margin: 0 0 2.5rem; max-width: 62ch; font-size: .95rem; }
  .g-section { margin-top: 3rem; border-top: 1px solid var(--de-hairline); padding-top: 1.2rem; }
  html[data-tone="paper"] .g-section { border-top-color: var(--de-paper-hairline); }
  .g-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .g-head h2 { font-family: "Space Grotesk", sans-serif; font-size: 1.15rem; margin: 0; }
  .g-meta { font-family: "Oxanium", monospace; font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; opacity: .6; margin: 0; }
  .g-row { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 2rem; align-items: start; }
  @media (max-width: 900px) { .g-row { grid-template-columns: 1fr; } .g-narrow { max-width: 360px; } }
  .g-state { display: flex; align-items: center; gap: 1rem; margin: 1.2rem 0; font-family: "Oxanium", monospace; font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; opacity: .8; }
  .g-state input { flex: 1; max-width: 24rem; accent-color: #d3126a; }
  .g-stages { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 1rem; }
  .g-cell { border: 1px solid var(--de-hairline); padding: .6rem; }
  html[data-tone="paper"] .g-cell { border-color: var(--de-paper-hairline); }
  .g-cellname { margin: 0 0 .4rem; font-family: "Oxanium", monospace; font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; opacity: .6; }

<style>/* ==========================================================================
   DE diagram system · diagrams.css
   Grammar: design/DIAGRAM_SYSTEM.md. Hairlines, not glow. Magenta only for
   the active/selected state. Tokens fall back to the Layer 0 values so the
   sheet also works outside the app (gallery, Scrollcraft builds).
   ========================================================================== */

.dg {
  --dg-ink: #ffffff;
  --dg-soft: rgba(255, 255, 255, 0.55);
  --dg-line: rgba(255, 255, 255, 0.28);
  --dg-hairline: var(--de-hairline, rgba(255, 255, 255, 0.1));
  --dg-field: var(--de-bg, #050312);
  --dg-raised: var(--de-raised, #151217);
  --dg-accent: #d3126a;
  --dg-accent-ink: #f04c97;
  --dg-display: "Space Grotesk", system-ui, sans-serif;
  --dg-text: "Inter", system-ui, sans-serif;
  --dg-mono: "Oxanium", "JetBrains Mono", ui-monospace, monospace;
  --dg-p: 1;
  --dg-draw-ms: 600ms;
  --dg-ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  margin: 0;
  display: grid;
  gap: 0.6rem;
  color: var(--dg-ink);
  font-family: var(--dg-text);
}
.dg--paper {
  --dg-ink: #1a1228;
  --dg-soft: #5a5368;
  --dg-line: rgba(26, 18, 40, 0.34);
  --dg-hairline: var(--de-paper-hairline, rgba(26, 18, 16, 0.1));
  --dg-field: var(--de-paper, #f7f5f2);
  --dg-raised: var(--de-paper-raised, #ffffff);
  --dg-accent: #a30e52;
  --dg-accent-ink: #a30e52;
}

.dg svg { display: block; width: 100%; height: auto; overflow: visible; }
.dg text { font-family: var(--dg-text); fill: var(--dg-ink); }
.dg .dg-code { font-family: var(--dg-mono); font-size: 9.5px; letter-spacing: 0.09em; font-weight: 600; fill: var(--dg-soft); text-transform: uppercase; }
.dg .dg-label { font-family: var(--dg-display); font-size: 12.5px; font-weight: 700; fill: var(--dg-ink); }

    const cy = wide ? 190 : 170;
    const radii = [44, 76, 108, 140];
    const rings = [...TIER_ORDER].map((t, i) => i).reverse().map((i) => {
      const t = TIER_ORDER[i];
      return `<g class="dg-ring" data-dg-at="${i}" data-tier="${t}"><circle cx="${cx}" cy="${cy}" r="${radii[i]}" pathLength="1"/></g>`;
    }).join("");
    const core = `<circle class="dg-core" cx="${cx}" cy="${cy}" r="6" data-dg-at="0"/>`;
    const legend = TIER_ORDER.map((t, i) => {
      const x = wide ? 380 : 40;
      const y = wide ? 96 + i * 62 : 340 + i * 44;
      return `<g class="dg-legend" data-dg-at="${i}" data-tier="${t}"><circle cx="${x}" cy="${y}" r="4"/><text class="dg-label" x="${x + 14}" y="${y + 4}">${TIER_LABEL[t]}</text><text class="dg-sub" x="${x + 14}" y="${y + 20}">${esc(TIER_DESC[t])}</text></g>`;
    }).join("");
    const vb = wide ? "0 0 600 380" : "0 0 360 530";
    return wrap(COVERAGE_META, rings + core + legend, vb, o);
  }
  var STAGES = [
    { id: "assess", code: "01", label: "Discovery & assessment", sub: "risk & gap" },
    { id: "model", code: "02", label: "Fit-based operating model", sub: "IT \xB7 Office \xB7 Business \xB7 Enterprise" },
    { id: "harden", code: "03", label: "Hardening & integration", sub: "baseline & runbooks" },
    { id: "manage", code: "04", label: "Continuous management", sub: "24/7 \xB7 vCIO", emphasis: true }
  ];
  var LOOP = ["monitor", "review", "patch", "drill"];
  var LIFECYCLE_META = {
    id: "lifecycle",
    title: "The operating cadence",
    classification: "ILLUSTRATIVE",
    label: "service delivery structure",
    nodes: STAGES.length + LOOP.length,
    stages: ["discovery & assessment", "fit-based operating model", "hardening & integration", "continuous management", "the cadence keeps running"],
    source: "The four stages of DE's service delivery playbook, with the continuous loop that runs inside stage four: monitoring, reviews, patching, restore drills."
  };
  function renderLifecycle(o) {
    const wide = o.layout === "wide";
    const pos = wide ? { assess: { x: 110, y: 90 }, model: { x: 330, y: 90 }, harden: { x: 330, y: 250 }, manage: { x: 110, y: 250 } } : { assess: { x: 180, y: 46 }, model: { x: 180, y: 126 }, harden: { x: 180, y: 206 }, manage: { x: 180, y: 286 } };
    const w = wide ? 176 : 250;
    const nodes = STAGES.map((n, i) => nodeSvg({ ...n, at: i }, pos[n.id], w, 46)).join("");
    const order = ["assess", "model", "harden", "manage"];
    const edges = order.map((id, i) => {
      if (i === order.length - 1) return "";
      return edgeSvg(pos[id], pos[order[i + 1]], i + 1, true, w, 46);
    }).join("");
    const lc = wide ? { x: 110, y: 340 } : { x: 180, y: 380 };
    const r = 44;
    const loopArcs = LOOP.map((l, i) => {
      const a0 = -Math.PI / 2 + i * Math.PI / 2;
      const a1 = a0 + Math.PI / 2 - 0.28;
      const x0 = lc.x + r * Math.cos(a0);
      const y0 = lc.y + r * Math.sin(a0);
      const x1 = lc.x + r * Math.cos(a1);
      const y1 = lc.y + r * Math.sin(a1);
      const lx = lc.x + (r + 18) * Math.cos(a0 + Math.PI / 4);
      const ly = lc.y + (r + 18) * Math.sin(a0 + Math.PI / 4);
      return `<g class="dg-loop" data-dg-at="4"><path class="dg-edge dg-edge--dir" pathLength="1" d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" marker-end="url(#dg-arrow)"/><text class="dg-code" x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="middle">${l.toUpperCase()}</text></g>`;
    }).join("");
    const loopLink = `<path class="dg-edge" data-dg-at="4" pathLength="1" d="M${pos.manage.x} ${pos.manage.y + 25} L${lc.x} ${lc.y - r - 4}"/>`;
    const vb = wide ? "0 0 600 420" : "0 0 360 450";
    return wrap(LIFECYCLE_META, edges + nodes + loopLink + loopArcs, vb, o);
  }
  var REGISTRY = {
    environment: { meta: ENVIRONMENT_META, render: renderEnvironment },
    protection: { meta: PROTECTION_META, render: renderProtection },
    assessment: { meta: ASSESSMENT_META, render: renderAssessment },
    coverage: { meta: COVERAGE_META, render: renderCoverage },
    lifecycle: { meta: LIFECYCLE_META, render: renderLifecycle }
  };
  var DIAGRAM_IDS = ["environment", "protection", "assessment", "coverage", "lifecycle"];
  function diagramMeta(id) {
    return REGISTRY[id].meta;
  }
  var counter = 0;
  function renderDiagram(id, opts = {}) {
    const o = {
      layout: opts.layout ?? "wide",
      tone: opts.tone ?? "dark",
      state: opts.state ?? 1,
      id: opts.id ?? `dg-${id}-${++counter}`,
      caption: opts.caption ?? true
    };
    return REGISTRY[id].render(o);
  }
  function setDiagramState(figure, state) {
    const stages = Number(figure.getAttribute("data-dg-stages") || "1");
    const { stage, p } = stageOf(state, stages);
    if (figure.getAttribute("data-dg-stage") !== String(stage)) figure.setAttribute("data-dg-stage", String(stage));
    figure.style.setProperty("--dg-p", p.toFixed(3));
    const id = figure.getAttribute("data-diagram");
    const svg = figure.querySelector("svg");
    if (id && svg) svg.setAttribute("aria-label", `${REGISTRY[id].meta.title}: ${REGISTRY[id].meta.stages[stage]}`);
  }

  // scrollcraft/diagrams/gallery-entry.ts
  var root = document.getElementById("gallery");
  var tone = document.documentElement.dataset.toneWant || "dark";
  document.documentElement.dataset.tone = tone;
  for (const id of DIAGRAM_IDS) {
    const meta = diagramMeta(id);
    const section = document.createElement("section");
    section.className = "g-section";
    section.innerHTML = `<header class="g-head"><h2>${meta.title}</h2><p class="g-meta">${meta.classification.replace("_", " ")} \xB7 ${meta.nodes} nodes \xB7 ${meta.stages.length} stages</p></header><div class="g-row"><div class="g-wide"></div><div class="g-narrow"></div></div><label class="g-state"><span>state</span><input type="range" min="0" max="1" step="0.01" value="1"><output>${meta.stages[meta.stages.length - 1]}</output></label><div class="g-stages"></div>`;
    root.appendChild(section);
    const wide = section.querySelector(".g-wide");
    const narrow = section.querySelector(".g-narrow");
    wide.innerHTML = renderDiagram(id, { layout: "wide", tone, id: `w-${id}` });
    narrow.innerHTML = renderDiagram(id, { layout: "narrow", tone, id: `n-${id}` });
    const range = section.querySelector("input");
    const out = section.querySelector("output");
    range.addEventListener("input", () => {
      const v = Number(range.value);
      for (const fig of section.querySelectorAll("figure.dg")) setDiagramState(fig, v);
      const st = Number(section.querySelector("figure.dg").getAttribute("data-dg-stage"));
      out.textContent = meta.stages[st];
    });
    const strip = section.querySelector(".g-stages");
    meta.stages.forEach((name, i) => {
      const state = meta.stages.length === 1 ? 1 : (i + 1) / meta.stages.length - 1e-3;
      const cell = document.createElement("div");
      cell.className = "g-cell";
      cell.innerHTML = `<p class="g-cellname">${i} \xB7 ${name}</p>` + renderDiagram(id, { layout: "wide", tone, state, id: `s-${id}-${i}`, caption: false });
      strip.appendChild(cell);
    });
  }
})();
</script>
<script>
(function(){var a=document.getElementById('tone-toggle');a.textContent=(document.documentElement.dataset.tone==='paper')?'Switch to dark tone':'Switch to paper tone';a.addEventListener('click',function(e){e.preventDefault();var cur=document.documentElement.dataset.tone==='paper'?'dark':'paper';try{localStorage.setItem('dg-tone',cur)}catch(x){}location.reload();});})();
</script>

</body>
