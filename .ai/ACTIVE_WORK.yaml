    note: >-
      Per-object read ACL for private object storage, the follow-up from the
      closed PR 300 reconciliation (its invoice/rate-limiter pieces already
      landed in PR 299). GET /objects/:path moves off blanket admin-only to a
      default-deny per-object decision: DE admin, the object's GCS ACL
      owner/grantee, or a member of the tenant (client) that owns the object's
      path in portal_tenant_files may read; everyone else, including other
      authenticated tenants, gets 403. Admin keeps full access, so this is a
      strict, safe widening that enables non-admin tenant reads. Pure decision
      function (authorizeObjectRead) plus a route integration test. The
      tenant-owner evidence read (findTenantFileByFileUrl) is DB-backed
      (portal_tenant_files) with a cache fallback so it survives restarts;
      full reliability of the tenant-file flow still depends on durable writes
      (tenant-file durability, issues 233/259). Reconciled onto main d5f3479.
