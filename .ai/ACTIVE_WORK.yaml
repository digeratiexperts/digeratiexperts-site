    base_sha: 634390fd
    files:
      - server/routes.ts (authMiddleware's live-user resolution only)
      - server/warehouseAccess.ts (resolveWarehouseStaff's live-user resolution only)
      - server/portalAuthFailClosed.test.ts (two added cases)
      - server/legacyAuthRetired.ts, server/legacyAuthRetired.test.ts (legacy /api/auth/register and /api/auth/login answer 410)
      - server/routes.ts (legacy register/login handlers and their now-unused helpers removed)
    status: verified-live
    started: 2026-10-01
    note: >-
      Issue 236 (P0), confirmed on a local production build after Joe's "so
      everything is complete and we cant think of things to do now?":
      authMiddleware resolved the live user by the token's email before its
      userId and never checked the two agreed, so a validly-signed token whose
      email names another account (e.g. one minted by the unauthenticated
      legacy /api/auth/register, which lets the caller choose any email)
      resolved to that account and assumed its role, admin included, with no
      password or MFA. Reproduced: a legacy-register token carrying a portal
      admin's email authenticated as that admin. The email lookup is now
      trusted only when it resolves to the token's own userId, in both
      authMiddleware and resolveWarehouseStaff. Two regression tests fail
